<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETERNALGY C&amp;I PORTAL — Commercial Department</title>
<script>
  (function(){
    try{
      var saved = window.localStorage.getItem('eternalgy_theme_mode');
      if(saved === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); }
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2F6FB0;
    --navy-2:#3E82C4;
    --sidebar-a:#13294B;
    --sidebar-b:#1D3F72;
    --paper:#F5F7FA;
    --panel:#FFFFFF;
    --panel-2:#EEF2F6;
    --ink:#1B2733;
    --ink-soft:#5B6B7A;
    --amber:#F0A93E;
    --amber-deep:#C97D1A;
    --amber-ink:#C97D1A;
    --line:#DCE3EA;
    --green:#2E9E6D;
    --red:#D14C4C;
    --blue:#2F86C0;
    --tint-green-bg:#E6F3EC;
    --tint-green-border:#BFE0CC;
    --tint-green-text:#1E7A4C;
    --tint-amber-bg:#FFF6E8;
    --tint-amber-border:#F0D9A8;
    --radius:10px;
  }
  html[data-theme="dark"]{
    --navy:#5B9BD9;
    --navy-2:#78B0E5;
    --sidebar-a:#060D18;
    --sidebar-b:#0D1E36;
    --paper:#0E141C;
    --panel:#1A2430;
    --panel-2:#222E3B;
    --ink:#E7ECF2;
    --ink-soft:#8DA0B3;
    --amber:#F0A93E;
    --amber-deep:#D9932E;
    --amber-ink:#F0B85C;
    --line:#2C3A49;
    --green:#3DBB82;
    --red:#E2695F;
    --blue:#5B9BD9;
    --tint-green-bg:rgba(61,187,130,0.16);
    --tint-green-border:rgba(61,187,130,0.45);
    --tint-green-text:#6FD9A6;
    --tint-amber-bg:rgba(240,169,62,0.14);
    --tint-amber-border:rgba(240,169,62,0.4);
  }
  html, body{ background:var(--paper); transition:background .15s ease; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'IBM Plex Sans', sans-serif; background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.display{font-family:'Space Grotesk', sans-serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}

  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:230px; flex-shrink:0;
    background:linear-gradient(180deg, var(--sidebar-a) 0%, var(--sidebar-b) 100%);
    color:#EAF5F0; padding:22px 16px; position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; gap:22px;
  }
  .brand{padding:0 6px;}
  .brand .brand-logo{ width:100%; max-width:172px; height:auto; display:block; margin-bottom:12px;
    background:#fff; border-radius:6px; padding:6px 8px; }
  .brand h1{font-size:14.5px; margin:0; letter-spacing:.2px; line-height:1.3;}
  .brand p{font-size:11.5px; color:#9BCBBB; margin:4px 0 0; letter-spacing:.4px; text-transform:uppercase;}

  nav{display:flex; flex-direction:column; gap:3px;}
  nav button{ all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:8px;
    font-size:13px; color:#C4DFD4; font-weight:500; transition:background .15s ease, color .15s ease; }
  nav button .num{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:#5F9484; width:16px; }
  nav button:hover{background:rgba(255,255,255,0.08); color:#fff;}
  nav button.active{background:rgba(240,169,62,0.18); color:#fff;}
  nav button.active .num{color:var(--amber);}
  nav .sub{padding-left:26px; font-size:12px;}
  /* IT Admin is not part of the 01-08 module sequence — its own labelled group. */
  .nav-group-sep{
    display:flex; align-items:center; gap:8px; margin:14px 4px 6px;
    font-size:9.5px; text-transform:uppercase; letter-spacing:1.1px; color:#5F9484;
  }
  .nav-group-sep::after{ content:''; flex:1; height:1px; background:rgba(255,255,255,0.14); }
  nav button.nav-system{ color:#BFD8CE; }
  nav button.nav-system.active{ background:rgba(240,169,62,0.18); color:#fff; }

  .sync-status{font-size:10.5px; color:#7FE3B4; display:flex; align-items:center; gap:6px; padding:0 6px;}
  .sync-status.offline{color:#F0C069;}
  .sync-dot{width:6px;height:6px;border-radius:50%; background:currentColor; flex-shrink:0;}

  .sidebar-footer{margin-top:auto; font-size:11px; color:#5F9484; padding:0 6px; line-height:1.5;}
  .sidebar-footer button{ all:unset; cursor:pointer; display:block; width:100%; background:rgba(255,255,255,0.08); color:#EAF5F0;
    text-align:center; padding:9px 0; border-radius:8px; font-size:12px; font-weight:500; margin-bottom:8px; transition:background .15s ease; }
  .sidebar-footer button:hover{background:rgba(255,255,255,0.14);}
  .theme-toggle{ display:flex; gap:4px; background:rgba(255,255,255,0.08); border-radius:8px; padding:3px; margin-bottom:8px; }
  .theme-toggle button{ all:unset; cursor:pointer; flex:1; text-align:center; padding:7px 0; border-radius:6px; font-size:11.5px;
    font-weight:600; color:#B9CCE0; transition:background .15s ease, color .15s ease; }
  .theme-toggle button.active{ background:var(--amber); color:#1A1200; }

  .main-wrap{flex:1; display:flex; flex-direction:column; min-width:0;}
  .main{flex:1; padding:32px 40px; max-width:1180px; width:100%;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 40px; background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:30;
  }
  .topbar-context{ font-size:12px; color:var(--ink-soft); }
  .topbar-context strong{ color:var(--navy); font-weight:600; }
  .topbar-signout{ background:var(--panel); }
  .topbar-signout:hover{ border-color:var(--red); color:var(--red); }
  .page-head{margin-bottom:26px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
  .page-head .eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--amber-ink); font-weight:600; margin:0 0 6px; }
  .page-head h2{font-size:26px; margin:0 0 6px; color:var(--navy);}
  .page-head p{font-size:13.5px; color:var(--ink-soft); margin:0; max-width:640px;}

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; }
  .panel + .panel{margin-top:16px;}

  .btn{ all:unset; cursor:pointer; font-family:inherit; font-weight:600; font-size:13px; padding:9px 16px; border-radius:8px; display:inline-flex; align-items:center; gap:6px; }
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-amber{background:var(--amber); color:#1A1200;}
  .btn-amber:hover{background:var(--amber-deep); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy); color:var(--navy);}
  .btn-danger{background:transparent; color:var(--red); font-size:12px;}
  .btn-danger:hover{text-decoration:underline;}
  .btn-icon{background:transparent; color:var(--ink-soft); padding:5px 7px; border-radius:6px; font-size:12px;}
  .btn-icon:hover{background:var(--panel-2); color:var(--navy);}

  input, select, textarea{ font-family:inherit; font-size:13.5px; color:var(--ink); border:1px solid var(--line); border-radius:7px;
    padding:8px 10px; background:var(--panel-2); width:100%; }
  textarea{resize:vertical; min-height:56px;}
  input:focus, select:focus, textarea:focus, button:focus-visible{ outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber); }
  label{font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > .field{flex:1; min-width:150px;}

  .client-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; flex-wrap:wrap;}
  .add-client-form{margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
  .add-client-form .field{margin-bottom:10px;}

  .client-search-row{display:flex; gap:8px; flex-wrap:wrap;}
  .client-search-row input[type="search"]{flex:1; min-width:200px;}

  .client-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; }
  .client-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
  .client-name{font-size:16.5px; font-weight:600; color:var(--navy); margin:0 0 2px;}
  .client-meta{font-size:12px; color:var(--ink-soft); margin:0;}
  .client-sub-meta{font-size:11.5px; color:var(--ink-soft); margin:5px 0 0; line-height:1.5;}
  .client-sub-meta span{margin-right:12px; white-space:nowrap; display:inline-block;}

  .roof-photos{margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
  .roof-photos-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .roof-photos-head label.title{font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; margin:0;}
  .btn-upload{ all:unset; cursor:pointer; font-family:inherit; font-weight:600; font-size:12px; padding:7px 12px; border-radius:8px;
    background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-upload:hover{border-color:var(--navy); color:var(--navy);}
  .roof-photo-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px;}
  .roof-photo{position:relative; border-radius:7px; overflow:hidden; border:1px solid var(--line); aspect-ratio:1/1; background:var(--panel-2);}
  .roof-photo img{width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;}
  .roof-photo-remove{ all:unset; cursor:pointer; position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%;
    background:rgba(18,32,58,0.7); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; line-height:1; }
  .roof-photo-remove:hover{background:var(--red);}
  .client-picker-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .client-chip{ all:unset; cursor:pointer; font-size:12.5px; padding:7px 14px; border-radius:20px; border:1px solid var(--line);
    color:var(--ink-soft); background:var(--panel-2); white-space:nowrap; }
  .client-chip:hover{border-color:var(--navy); color:var(--navy);}
  .client-chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .roof-photo-empty{font-size:12px; color:var(--ink-soft); margin:0;}
  .proposal-file-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px;
    padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); }
  .proposal-file-link{ font-size:12.5px; font-weight:600; color:var(--navy); text-decoration:none; display:flex; align-items:center; gap:6px; }
  .proposal-file-link:hover{text-decoration:underline;}
  .proposal-file-remove{ all:unset; cursor:pointer; font-size:11px; color:var(--ink-soft); padding:3px 6px; border-radius:5px; flex-shrink:0; }
  .proposal-file-remove:hover{background:rgba(209,76,76,0.1); color:var(--red);}

  .modal-overlay{ position:fixed; inset:0; background:rgba(11,37,69,0.55); display:flex; align-items:flex-start;
    justify-content:center; z-index:80; padding:32px 20px; overflow-y:auto; }
  .modal-box{ background:var(--panel); border-radius:14px; max-width:720px; width:100%; padding:26px 28px 22px;
    box-shadow:0 24px 60px rgba(11,37,69,0.35); }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px;}
  .modal-head h2{margin:0; font-size:21px; color:var(--navy);}
  .modal-close{ all:unset; cursor:pointer; width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:14px; flex-shrink:0; }
  .modal-close:hover{border-color:var(--navy); color:var(--navy);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line);}
  /* ---- Photo lightbox (in-page viewer, no popups) ---- */
  .lightbox-overlay{ position:fixed; inset:0; background:rgba(8,16,28,0.88); display:flex; align-items:center;
    justify-content:center; z-index:200; padding:32px; cursor:zoom-out; }
  .lightbox-overlay img{ max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,0.5); cursor:default; }
  .lightbox-close{ position:fixed; top:18px; right:22px; z-index:201; all:unset; cursor:pointer; width:38px; height:38px;
    border-radius:10px; background:rgba(255,255,255,0.12); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:18px; }
  .lightbox-close:hover{ background:rgba(255,255,255,0.22); }
  /* ---- Report summary (printable one-pager) ---- */
  .letterhead-block{ margin:0 0 14px; }
  .letterhead-img{ width:100%; max-width:520px; height:auto; display:block; }
  .letterhead-rule{ height:2px; background:linear-gradient(90deg, var(--navy) 0%, var(--navy) 60%, transparent 100%); margin:0 0 18px; }
  .report-doc{ background:#fff; border-radius:4px; counter-reset:section-counter; }
  .report-doc h1{ font-size:20px; margin:0 0 2px; color:var(--navy); }
  .report-doc .report-doc-sub{ color:var(--ink-soft); font-size:12.5px; margin:0 0 14px; }
  /* Document control strip — doc no / generated timestamp / classification,
     gives every exported report a formal, traceable document identity. */
  .doc-control{ display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; background:#F4F6F5; border:1px solid var(--line); border-radius:5px; padding:8px 14px; margin:0 0 18px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }
  .doc-control b{ color:var(--navy); font-weight:600; }
  .doc-control .doc-classification{ margin-left:auto; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:#8A5A00; background:#FCEBC7; padding:2px 8px; border-radius:3px; }
  .report-doc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; margin-bottom:16px; }
  .report-doc-field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:2px; }
  .report-doc-field div{ font-size:13.5px; color:var(--ink); font-variant-numeric:tabular-nums; }
  .report-doc-section{ margin-top:18px; counter-increment:section-counter; }
  .report-doc-section h3{ font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--navy); margin:0 0 8px; border-bottom:1.5px solid var(--navy); padding-bottom:5px; font-weight:700; }
  .report-doc-section h3::before{ content:counter(section-counter, decimal) ".0  "; color:var(--navy); }
  .report-doc-section p{ font-size:13.5px; line-height:1.6; white-space:pre-line; margin:0; }
  .report-doc-photos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin-top:8px; }
  .report-doc-photos img{ width:100%; height:90px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .report-doc table{ border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  .report-doc table th, .report-doc table td{ padding:7px 8px; text-align:left; border-bottom:1px solid var(--line); }
  .report-doc table th{ font-size:10.2px; text-transform:uppercase; letter-spacing:.04em; color:#fff; background:var(--navy); font-weight:600; }
  .report-doc table thead tr:first-child th:first-child{ border-top-left-radius:3px; }
  .report-doc table thead tr:first-child th:last-child{ border-top-right-radius:3px; }
  .report-doc table tbody tr:nth-child(even){ background:#F6F8F7; }
  .report-doc table tbody tr:hover{ background:#EFF3F1; }
  .report-doc-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:14px 0; }
  .report-doc-stats .stat{ border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .report-doc-stats .stat .v{ font-family:'IBM Plex Mono', monospace; font-size:17px; font-weight:600; color:var(--navy); }
  .report-doc-stats .stat .l{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-top:2px; }
  /* Sign-off / approval block — appended to every report for a formal,
     technical-document feel (common in engineering / compliance docs). */
  .doc-signoff{ margin-top:34px; padding-top:16px; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(3,1fr); gap:22px; page-break-inside:avoid; }
  .doc-signoff .signoff-col label{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:26px; }
  .doc-signoff .signoff-line{ border-top:1px solid var(--ink); margin-bottom:5px; }
  .doc-signoff .signoff-sub{ font-size:10px; color:var(--ink-soft); }
  .doc-footer-note{ margin-top:18px; font-size:9.5px; color:var(--ink-soft); text-align:center; border-top:1px solid var(--line); padding-top:8px; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ position:absolute; left:0; top:0; width:100%; padding:0; }
    .no-print{ display:none !important; }
    @page{ margin:16mm 14mm 18mm; }
  }
  .pipeline-toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .pipeline-toolbar .client-search-row{flex:1; min-width:240px;}

  .ring-wrap{display:flex; align-items:center; gap:12px;}
  .ring{width:56px; height:56px; border-radius:50%; flex-shrink:0; position:relative; display:flex; align-items:center; justify-content:center;}
  .ring span{position:absolute; font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; color:var(--navy);}
  .ring-label{font-size:11px; color:var(--ink-soft); line-height:1.4;}
  .ring-label b{color:var(--navy); font-family:'IBM Plex Mono', monospace; font-size:12.5px;}

  .stage-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:8px; margin-top:16px; align-items:start; }
  .stage-item{ border-radius:7px; border:1px solid var(--line); background:var(--panel-2); transition:background .12s ease, border-color .12s ease; overflow:hidden; }
  .stage-item.done{background:var(--tint-green-bg); border-color:var(--tint-green-border);}
  .stage-item.final{border-color:var(--tint-amber-border);}
  .stage-item.final.done{border-color:var(--tint-green-border);}
  .stage-row{ display:flex; align-items:center; gap:8px; padding:8px 9px; cursor:pointer; user-select:none; }
  .stage-row input{width:auto; margin:0; accent-color:var(--green); cursor:pointer; flex-shrink:0;}
  .stage-row .stage-idx{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-soft); flex-shrink:0;}
  .stage-row .stage-text{font-size:12.5px; color:var(--ink); line-height:1.3; flex:1;}
  .stage-item.done .stage-text{color:var(--green); font-weight:500;}
  .stage-note-btn{ all:unset; cursor:pointer; font-size:12px; padding:3px 5px; border-radius:5px; color:var(--ink-soft); flex-shrink:0; position:relative; }
  .stage-note-btn:hover{background:var(--panel-2);}
  .stage-note-btn.has-note{color:var(--amber-ink);}
  .stage-note-btn .dot{ position:absolute; top:2px; right:2px; width:6px; height:6px; border-radius:50%; background:var(--amber-deep); }
  .stage-remark-wrap{padding:0 9px 9px;}
  .stage-remark-wrap textarea{font-size:12px; min-height:44px;}
  .final-badge{ font-size:9.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--amber-ink); font-weight:700; padding:0 9px; }

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); font-weight:600; padding:8px 10px; border-bottom:2px solid var(--line); }
  td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  td input{padding:6px 8px; font-size:13px;}
  tr:last-child td{border-bottom:none;}
  .mat-total-row td{font-weight:600; color:var(--navy); border-top:2px solid var(--line); border-bottom:none;}
  .client-select-bar{display:flex; gap:12px; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap;}
  .client-select-bar .field{min-width:220px; margin-bottom:0;}

  .pipeline-board{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:4px;}
  .pipeline-col{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:12px; min-height:120px;}
  .pipeline-col h3{font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); margin:0 0 10px;}
  .pipeline-card{ background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:9px 10px; margin-bottom:8px; font-size:12.5px; }
  .pipeline-card .lead-name{font-weight:600; color:var(--navy); display:block; margin-bottom:3px;}
  .pipeline-card select{margin-top:6px; font-size:11.5px; padding:5px 6px;}
  .pipeline-card .kw{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--amber-ink);}
  .pipeline-card-meta{font-size:11px; color:var(--ink-soft); margin-top:4px;}
  .pipeline-card-badge{ display:inline-block; margin-top:5px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.3px;
    color:var(--green); background:var(--tint-green-bg); border:1px solid var(--tint-green-border); border-radius:20px; padding:2px 8px; }
  .pipeline-card-actions{display:flex; gap:6px; margin-top:8px;}
  .pipeline-card-actions .btn{padding:6px 9px; font-size:11px; flex:1; justify-content:center;}

  .result-strip{display:flex; gap:14px; flex-wrap:wrap; margin-top:18px;}
  .result-tile{ flex:1; min-width:140px; background:var(--navy); color:#fff; border-radius:var(--radius); padding:16px 18px; }
  .result-tile .val{font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; color:var(--amber);}
  .result-tile .lbl{font-size:11px; color:#C7D9EC; text-transform:uppercase; letter-spacing:.5px; margin-top:4px;}

  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13px; border:1px dashed var(--line); border-radius:var(--radius); }

  .stage-config-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .stage-config-row:last-child{border-bottom:none;}
  .stage-config-row .order-btns{display:flex; flex-direction:column; gap:2px;}
  .stage-config-row .order-btns button{ all:unset; cursor:pointer; font-size:10px; color:var(--ink-soft); padding:1px 4px; border-radius:3px; }
  .stage-config-row .order-btns button:hover{background:var(--panel-2); color:var(--navy);}
  .stage-config-row input{flex:1;}
  .stage-config-idx{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); width:24px; flex-shrink:0;}
  .stage-config-final-tag{font-size:10px; color:var(--amber-ink); font-weight:700; text-transform:uppercase; width:64px; flex-shrink:0; text-align:right;}

  .notice{ background:var(--tint-amber-bg); border:1px solid var(--tint-amber-border); color:var(--amber-ink); font-size:12.5px; padding:10px 14px; border-radius:8px; margin-bottom:16px; }

  /* Module 09 — Guidelines */
  .guide-filters{ display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 18px; }
  .guide-chip{ all:unset; cursor:pointer; font-size:12px; font-weight:500; padding:6px 13px; border-radius:20px;
    border:1px solid var(--line); color:var(--ink-soft); background:var(--panel); transition:background .15s ease, color .15s ease; }
  .guide-chip:hover{background:var(--panel-2);}
  .guide-chip.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .guide-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .guide-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; cursor:pointer; }
  .guide-card-titles{flex:1; min-width:0;}
  .guide-card-titles h3{ margin:0 0 5px; font-size:15px; }
  .guide-card-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--ink-soft); }
  .guide-cat-tag{ background:var(--tint-green-bg); color:var(--tint-green-text); border-radius:20px; padding:2px 10px; font-weight:600; letter-spacing:.2px; }
  .guide-card-actions{ display:flex; gap:6px; flex-shrink:0; }
  .guide-card-actions .btn{padding:6px 9px; font-size:11px;}
  .guide-toggle{ all:unset; cursor:pointer; font-size:12px; color:var(--ink-soft); padding:4px; flex-shrink:0; }
  .guide-card-body{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:13.5px; line-height:1.65; white-space:pre-line; }
  .guide-card-attachment{ margin-top:12px; }
  .guide-empty{ text-align:center; color:var(--ink-soft); font-size:13px; padding:40px 0; }

  /* ---- Module 06/07/08 shared bits ---- */
  .toolbar-row{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .toolbar-row .client-search-row{flex:1; min-width:220px;}
  .status-select{ all:unset; cursor:pointer; font-family:inherit; font-weight:600; font-size:12.5px; padding:7px 12px;
    border-radius:20px; border:1px solid transparent; appearance:none; -webkit-appearance:none; text-align:center; }
  .card-row{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; }
  .card-row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
  .card-row-top .name{font-size:15.5px; font-weight:600; color:var(--navy); margin:0 0 3px;}
  .card-row-top .sub{font-size:12px; color:var(--ink-soft); margin:0;}
  .card-row-fields{display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:10px;}
  .card-row-fields .field{margin-bottom:0; min-width:180px; flex:1;}
  .worker-list{font-size:12.5px; color:var(--ink); line-height:1.6; white-space:pre-line; margin:0;}
  .report-summary{font-size:12.5px; color:var(--ink); line-height:1.5; margin:8px 0 0; white-space:pre-line;}
  .report-photo-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px; margin-top:10px;}
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px; margin-top:4px;}
  .kpi-tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
  .kpi-tile .kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); font-weight:600; margin:0 0 8px;}
  .kpi-tile .kpi-value{font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:600; color:var(--navy);}
  .kpi-tile .kpi-target{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .kpi-bar-track{height:8px; border-radius:5px; background:var(--line); margin-top:10px; overflow:hidden;}
  .kpi-bar-fill{height:100%; border-radius:5px; background:var(--amber);}
  .kpi-bar-fill.good{background:var(--green);}
  .kpi-bar-fill.bad{background:var(--red);}
  .kpi-settings-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px;}

  ::selection{background:rgba(245,166,35,0.35);}

  @media (max-width:900px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; flex-direction:row; align-items:center; overflow-x:auto;}
    .sidebar-footer, .sync-status{display:none;}
    .brand{display:none;}
    .user-block{margin:0 8px 0 0; flex-shrink:0;}
    nav{flex-direction:row;}
    .nav-group-sep{display:none !important;}
    .topbar{padding:10px 18px;}
    .main{padding:22px 18px;}
    .pipeline-board{grid-template-columns:1fr 1fr;}
  }

  /* ---------- DESKTOP UPDATE BANNER (Electron build only) ---------- */
  .update-bar{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:500;
    display:flex; align-items:center; gap:14px; max-width:calc(100vw - 32px);
    background:var(--navy); color:#EAF5F0; border-radius:10px; padding:11px 12px 11px 18px;
    box-shadow:0 12px 34px rgba(0,0,0,.32); font-size:13px;
  }
  .update-bar[hidden]{ display:none; }
  .update-bar-text{ line-height:1.4; }
  .update-bar-text strong{ color:var(--amber); font-weight:600; }
  .update-bar-btn{
    all:unset; cursor:pointer; background:var(--amber); color:#1A1200; font-weight:600; font-size:12.5px;
    padding:7px 14px; border-radius:7px; white-space:nowrap;
  }
  .update-bar-btn:hover{ background:#FFC163; }
  .update-bar-dismiss{
    all:unset; cursor:pointer; color:#9BCBBB; padding:5px 7px; border-radius:6px; font-size:12px;
  }
  .update-bar-dismiss:hover{ background:rgba(255,255,255,0.1); color:#fff; }

  /* ---------- AUTH / SIGN-IN ---------- */
  .auth-screen{
    position:fixed; inset:0; z-index:400; display:flex; align-items:center; justify-content:center;
    padding:24px; background:linear-gradient(150deg, var(--sidebar-b) 0%, var(--navy) 55%, var(--sidebar-a) 100%);
    overflow:auto;
  }
  .auth-card{
    width:100%; max-width:460px; background:var(--panel); border-radius:16px; padding:40px 40px 34px;
    box-shadow:0 24px 60px rgba(0,0,0,.32);
  }
  .auth-card .auth-logo{ width:100%; max-width:190px; height:auto; display:block; margin:0 auto 22px; }
  .auth-card h2{ font-size:24px; margin:0 0 6px; color:var(--navy); text-align:center; }
  .auth-card .auth-sub{ font-size:13.5px; color:var(--ink-soft); margin:0 0 28px; text-align:center; line-height:1.5; }
  .auth-card label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); font-weight:600; margin-bottom:7px; }
  .auth-card input[type=text], .auth-card input[type=password]{ width:100%; font-size:15px; padding:12px 13px; }
  .auth-field{ margin-bottom:18px; }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:44px !important; }
  .pw-toggle{
    all:unset; cursor:pointer; position:absolute; right:4px; top:50%; transform:translateY(-50%);
    padding:6px 8px; border-radius:6px; font-size:14px; line-height:1; color:var(--ink-soft);
  }
  .pw-toggle:hover{ background:#EAF0EA; color:var(--navy); }
  .pw-toggle:focus-visible{ outline:2px solid var(--amber); }
  /* .btn uses all:unset, which resets box-sizing — restate it so 100% + padding stays inside the card */
  .auth-submit{ width:100%; box-sizing:border-box; justify-content:center; margin-top:8px; padding:13px 16px; font-size:15px; }
  .auth-error{
    background:#FBE4E4; border:1px solid #F0C4C4; color:#A63232; font-size:12.5px;
    padding:9px 12px; border-radius:8px; margin-bottom:14px; line-height:1.45;
  }
  .auth-hint{ font-size:12.5px; color:var(--ink-soft); text-align:center; margin:22px 0 0; line-height:1.55; }
  .auth-hint code{ font-family:'IBM Plex Mono', monospace; background:#EEF3EC; padding:1px 5px; border-radius:4px; }

  /* ---------- SIDEBAR USER BLOCK ---------- */
  .user-block{
    background:rgba(255,255,255,0.07); border-radius:8px; padding:10px 11px; margin:0 6px;
    display:flex; align-items:center; gap:9px;
  }
  .user-avatar{
    width:30px; height:30px; border-radius:50%; background:var(--amber); color:#1A1200; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px;
    font-family:'Space Grotesk', sans-serif;
  }
  .user-block-meta{ min-width:0; flex:1; }
  .user-block-name{ font-size:12.5px; color:#EAF5F0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-block-role{ font-size:10px; color:#9BCBBB; text-transform:uppercase; letter-spacing:.5px; }

  /* ---------- IT ADMIN ---------- */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .tabs button{
    all:unset; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft);
    padding:9px 15px; border-radius:8px 8px 0 0; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tabs button:hover{ color:var(--navy); background:#EEF3EC; }
  .tabs button.active{ color:var(--navy); border-bottom-color:var(--amber); }

  .role-pill{
    display:inline-block; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
    padding:3px 8px; border-radius:20px;
  }
  .role-pill.admin{ background:#FCEBC7; color:#8A5A00; }
  .role-pill.user{ background:#E4EAE2; color:#5E7069; }
  .role-pill.off{ background:#F7D9D9; color:#B23434; }

  .log-filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:4px; }
  .log-filters .field{ margin-bottom:0; flex:1; min-width:135px; }
  .log-table-wrap{ overflow-x:auto; }
  .log-table{ min-width:760px; }
  .log-table td{ font-size:12.5px; vertical-align:top; }
  .log-time{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); white-space:nowrap; }
  .log-user{ font-weight:600; color:var(--navy); white-space:nowrap; }
  .log-module{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; }
  .log-record{ font-weight:600; }
  .log-field{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); }
  .diff{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .diff-val{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; padding:2px 7px; border-radius:5px;
    max-width:260px; overflow-wrap:anywhere;
  }
  .diff-from{ background:#FBE9E9; color:#A63232; text-decoration:line-through; text-decoration-color:rgba(166,50,50,.45); }
  .diff-to{ background:#E1F3E8; color:#1E7A4C; }
  .diff-arrow{ color:var(--ink-soft); font-size:11px; }
  .action-pill{ display:inline-block; font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:5px; text-transform:uppercase; letter-spacing:.4px; }
  .action-create{ background:#E1F3E8; color:#1E7A4C; }
  .action-update{ background:#DCEEF7; color:#1C6E9C; }
  .action-delete{ background:#FBE9E9; color:#A63232; }
  .action-auth{ background:#F0EAF7; color:#6B4C9A; }
  .log-pager{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; flex-wrap:wrap; }
  .log-pager-info{ font-size:12px; color:var(--ink-soft); }
  /* ---------- DARK MODE: auth + IT Admin tints ---------- */
  html[data-theme="dark"] .pw-toggle:hover,
  html[data-theme="dark"] .tabs button:hover{ background:var(--panel-2); }
  html[data-theme="dark"] .auth-hint code{ background:var(--panel-2); }
  html[data-theme="dark"] .auth-error{ background:rgba(226,105,95,0.16); border-color:rgba(226,105,95,0.45); color:#F2A19A; }
  html[data-theme="dark"] .role-pill.admin{ background:var(--tint-amber-bg); color:var(--amber-ink); }
  html[data-theme="dark"] .role-pill.user{ background:var(--panel-2); color:var(--ink-soft); }
  html[data-theme="dark"] .role-pill.off{ background:rgba(226,105,95,0.16); color:#F2A19A; }
  html[data-theme="dark"] .diff-from,
  html[data-theme="dark"] .action-delete{ background:rgba(226,105,95,0.16); color:#F2A19A; }
  html[data-theme="dark"] .diff-to,
  html[data-theme="dark"] .action-create{ background:var(--tint-green-bg); color:var(--tint-green-text); }
  html[data-theme="dark"] .action-update{ background:rgba(91,155,217,0.18); color:#8FC1EE; }
  html[data-theme="dark"] .action-auth{ background:rgba(150,120,200,0.2); color:#C3AEE8; }
</style>
</head>

<script>
/* ---------------------------------------------------------
   DATA MODEL
   Shared online storage (window.storage, shared:true) keeps every
   colleague who opens this app in sync when it's available. This
   app also always writes to this browser's localStorage as a
   fallback, so data still saves and survives a refresh even when
   opened as a plain local file / normal web page outside Claude
   (where window.storage does not exist). Backup/Restore .json is
   still the way to move data between different browsers/people.
--------------------------------------------------------- */
const STORAGE_KEY = 'solarops_state_v1';
let storageAvailable = false; // true only when window.storage (live cross-user sync) works
let localStorageAvailable = false; // true when this browser's localStorage works

function defaultStageDefs(){
  return [
    { key:'deposit_received', label:'Deposit Received' },
    { key:'loan',             label:'Loan Approval (if any)' },
    { key:'client_deposit',   label:'Client Deposit' },
    { key:'material',         label:'Material Preparation' },
    { key:'document',         label:'Document Application' },
    { key:'tnb',              label:'TNB Application' },
    { key:'submit',           label:'Application Submitted' },
    { key:'commissioning',    label:'Testing & Commissioning' },
  ];
}

function buildStages(stageDefs){ const s={}; stageDefs.forEach(d=>s[d.key]=false); return s; }
function buildRemarks(stageDefs){ const r={}; stageDefs.forEach(d=>r[d.key]=''); return r; }

let state = {
  stageDefs: defaultStageDefs(),
  clients: [],

/* ---------------------------------------------------------

--------------------------------------------------------- */
function loadLocalState(){
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    localStorageAvailable = true;
    if(raw){
      state = JSON.parse(raw);
      migrateState();
      return true;
    }
  }catch(err){
    // localStorage disabled (private mode / browser policy) — app still
    // works, it just won't remember data after the tab is closed.
    localStorageAvailable = false;
  }
  return false;
}

async function loadSharedState(){
  // Try the live shared store first (only present inside Claude artifacts).
  try{
    if(window.storage){
      const res = await window.storage.get(STORAGE_KEY, true);
      storageAvailable = true;
      if(res && res.value){
        state = JSON.parse(res.value);
        migrateState();
        return true;
      }
    }
  }catch(err){
    // key doesn't exist yet, or storage unavailable
    if(window.storage) storageAvailable = true;
  }
  // Fall back to this browser's local copy so data survives refreshes
  // even when window.storage isn't available at all.
  return loadLocalState();
}

function migrateState(){
  if(!state.stageDefs) state.stageDefs = defaultStageDefs();
  state.clients.forEach(c=>{
    if(!c.stages) c.stages = buildStages(state.stageDefs);
    if(!c.stageRemarks) c.stageRemarks = buildRemarks(state.stageDefs);
    state.stageDefs.forEach(d=>{
      if(!(d.key in c.stages)) c.stages[d.key] = false;
      if(!(d.key in c.stageRemarks)) c.stageRemarks[d.key] = '';
    });
    if(typeof c.address !== 'string') c.address = '';
    if(typeof c.agent !== 'string') c.agent = '';
    if(typeof c.systemSize !== 'number') c.systemSize = c.systemSize ? parseFloat(c.systemSize)||0 : 0;

  clearTimeout(saveTimer);

    // stick when the app is opened as a normal web page/file.
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      localStorageAvailable = true;
    }catch(err){
      localStorageAvailable = false;
    }
    if(!storageAvailable){ setSyncStatus(true); return; }
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
      setSyncStatus(true);
    }catch(err){
      setSyncStatus(false);
    }
  }, 250);
}

function setSyncStatus(ok){
  const el = document.getElementById('syncStatus');
  const txt = document.getElementById('syncStatusText');
  if(!el) return;
  if(!storageAvailable){
    el.classList.remove('offline');
    txt.textContent = localStorageAvailable ? 'Saved on this device — use Backup to share' : 'Not saved — enable browser storage';
  } else if(ok){
    el.classList.remove('offline');
    txt.textContent = 'Synced — colleagues see this live';
  } else {
    el.classList.add('offline');
    txt.textContent = 'Sync issue — try Sync now';
  }
}

    if(res && res.value){

/* ---------------------------------------------------------
   AUTH — users, password hashing, session
   Scope note: this is a client-side accountability gate, not a
   security boundary. Everything runs in the browser, so anyone
   with DevTools can read or edit state directly. It keeps casual
   users out of IT Admin and gives every change a named author;
   it does not protect data from someone technical. Real access
   control needs a server.
--------------------------------------------------------- */
const SESSION_KEY = 'solarops_session_v1';
const SESSION_HOURS = 12;
const PW_ITERATIONS = 10000;
const PW_MIN_LENGTH = 6;
const DEFAULT_ADMIN = { username:'admin', password:'admin123', name:'IT Administrator' };
const LOCKOUT_AFTER = 5;      // failed attempts
const LOCKOUT_SECONDS = 60;

let currentUser = null;                 // the signed-in user object (lives in state.users)
let authMode = 'login';                 // 'login' | 'changePassword'
let authError = '';
let authNotice = '';
let showLoginPassword = false;          // the eye toggle on the sign-in form
const failedAttempts = new Map();       // username -> { count, until } (in-memory only)

/* --- SHA-256 (pure JS so it also works on file:// where crypto.subtle is absent) --- */
const K256 = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function rotr32(x, n){ return (x >>> n) | (x << (32 - n)); }

function utf8Bytes(str){
  if(typeof TextEncoder !== 'undefined') return Array.from(new TextEncoder().encode(str));
  const out = [];
  for(let i=0;i<str.length;i++){
    const c = str.charCodeAt(i);
    if(c < 0x80) out.push(c);
    else if(c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
    else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
  }
  return out;
}

function sha256Hex(str){
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes = utf8Bytes(str);
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  bytes.push(0, 0, 0, 0, (bitLen >>> 24) & 0xff, (bitLen >>> 16) & 0xff, (bitLen >>> 8) & 0xff, bitLen & 0xff);
  const w = new Array(64);
  for(let i=0;i<bytes.length;i+=64){
    for(let j=0;j<16;j++){
      w[j] = (bytes[i+j*4] << 24) | (bytes[i+j*4+1] << 16) | (bytes[i+j*4+2] << 8) | bytes[i+j*4+3];
    }
    for(let j=16;j<64;j++){
      const x = w[j-15], y = w[j-2];
      const s0 = rotr32(x,7) ^ rotr32(x,18) ^ (x >>> 3);
      const s1 = rotr32(y,17) ^ rotr32(y,19) ^ (y >>> 10);
      w[j] = (w[j-16] + s0 + w[j-7] + s1) | 0;
    }
    let a=H[0], b=H[1], c=H[2], d=H[3], e=H[4], f=H[5], g=H[6], h=H[7];
    for(let j=0;j<64;j++){
      const S1 = rotr32(e,6) ^ rotr32(e,11) ^ rotr32(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K256[j] + w[j]) | 0;
      const S0 = rotr32(a,2) ^ rotr32(a,13) ^ rotr32(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8,'0')).join('');
}

function randomSalt(){
  const arr = new Uint8Array(16);
  if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(arr);
  else for(let i=0;i<16;i++) arr[i] = Math.floor(Math.random()*256);
  return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
}

// Iterated salted SHA-256. Slows brute-forcing a stolen backup file;
// it does not make a client-side gate into real access control.
function hashPassword(password, salt){
  let h = sha256Hex(salt + '|' + password);
  for(let i=0;i<PW_ITERATIONS;i++) h = sha256Hex(h + salt);
  return h;
}

// Usernames may contain spaces ("amirul hakim"). Normalise on every read and
// write so capitals, stray leading/trailing spaces, or a double space typed at
// the sign-in box still resolve to the same account.
function normalizeUsername(v){
  return String(v == null ? '' : v).trim().replace(/\s+/g, ' ').toLowerCase();
}

function makeUser(username, password, name, role){
  const salt = randomSalt();
  return {
    id: uid(),
    username: normalizeUsername(username),
    name: name.trim() || normalizeUsername(username),
    role: role === 'admin' ? 'admin' : 'user',
    salt,
    hash: hashPassword(password, salt),
    active: true,
    mustChangePassword: false,
    createdAt: new Date().toISOString(),
    lastLogin: ''
  };
}

function findUserByName(username){
  const u = normalizeUsername(username);
  return state.users.find(x => normalizeUsername(x.username) === u) || null;
}

function isAdmin(){ return !!currentUser && currentUser.role === 'admin'; }
function activeAdminCount(){ return state.users.filter(u => u.role === 'admin' && u.active).length; }

function setPassword(user, password){
  user.salt = randomSalt();
  user.hash = hashPassword(password, user.salt);
}

/* --- session --- */
function saveSession(userId){
  try{
    window.localStorage.setItem(SESSION_KEY, JSON.stringify({
      userId, expiresAt: Date.now() + SESSION_HOURS*3600*1000
    }));
  }catch(err){ /* storage disabled — session just won't survive a refresh */ }
}

function clearSession(){
  try{ window.localStorage.removeItem(SESSION_KEY); }catch(err){}
}

function restoreSession(){
  try{
    const raw = window.localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.expiresAt || Date.now() > s.expiresAt){ clearSession(); return null; }
    const user = state.users.find(u => u.id === s.userId);
    if(!user || !user.active){ clearSession(); return null; }
    return user;
  }catch(err){ return null; }
}

  { key:'gitaCustomers',  module:'GITA Checklist',       noun:'customer', label:x => x.name },
  { key:'installReports', module:'Installation Reports', noun:'report',   label:x => x.siteName },
  { key:'weeklyReports',  module:'Weekly Job Report',    noun:'entry',    label:x => (x.pic || '') + (x.scope ? ' — ' + x.scope : '') },
  { key:'guidelines',     module:'Guidelines',           noun:'guideline',label:x => x.title },
  { key:'users',          module:'IT Admin',             noun:'user',     label:x => x.username },
];

const FIELD_LABELS = {
  quotedPrice:'Quoted price', systemSize:'System size (kWp)', projectAmount:'Project amount',
  expectedCloseDate:'Expected close', contactPerson:'Contact person', dateReceived:'Date received',
  dateReturned:'Date returned', dateInstallation:'Installation date', siteName:'Site name',
  wiringTeam:'Wiring team', installerTeam:'Installer team', mustChangePassword:'Force password change',
  probability:'Probability (%)', kw:'Size (kWp)', active:'Active', role:'Role', stage:'Stage'
};

function prettyField(path){
  return path.split('.').map(seg => {
    const base = seg.replace(/#\d+$/, '');
    const tail = seg.slice(base.length);
    if(FIELD_LABELS[base]) return FIELD_LABELS[base] + tail;
    const spaced = base.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/_/g, ' ');
    return spaced.charAt(0).toUpperCase() + spaced.slice(1) + tail;
  }).join(' / ');
}

function auditValue(v){
  if(v === null || v === undefined || v === '') return '(empty)';
  if(typeof v === 'boolean') return v ? 'Yes' : 'No';
  if(typeof v === 'string'){
    if(v.slice(0,5) === 'data:') return '[file ' + Math.max(1, Math.round(v.length/1365)) + ' KB]';
    if(v.length > 120) return v.slice(0,120) + '…';
  }
  return String(v);
}

function flattenEntity(obj, prefix, out, depth){
  out = out || {}; prefix = prefix || ''; depth = depth || 0;
  if(!obj || typeof obj !== 'object' || depth > 4) return out;
  Object.keys(obj).forEach(k => {
    if(k === 'id' || AUDIT_SKIP.indexOf(k) !== -1) return;
    const v = obj[k];
    const path = prefix ? prefix + '.' + k : k;
    if(v && typeof v === 'object'){
      if(Array.isArray(v)){
        out[path + '.count'] = v.length;
        v.forEach((item, i) => {
          if(item && typeof item === 'object') flattenEntity(item, path + '#' + (item.id != null ? item.id : i), out, depth+1);
          else out[path + '#' + i] = auditValue(item);
        });
      } else {
        flattenEntity(v, path, out, depth+1);
      }
    } else {
      out[path] = auditValue(v);
    }
  });
  return out;
}

function takeAuditSnapshot(){
  const snap = { coll:{}, labels:{}, settings:{} };
  AUDIT_COLLECTIONS.forEach(def => {
    const fields = {}, labels = {};
    (state[def.key] || []).forEach(item => {
      fields[item.id] = flattenEntity(item);
      labels[item.id] = def.label(item) || '(unnamed)';
    });
    snap.coll[def.key] = fields;
    snap.labels[def.key] = labels;
  });
  snap.settings.kpi = flattenEntity(state.kpi || {});
  snap.settings.stageDefs = flattenEntity({ stage: state.stageDefs || [] });
  return snap;
}

let auditSnapshot = null;

function diffFieldMaps(before, after){
  const keys = new Set(Object.keys(before).concat(Object.keys(after)));
  const changes = [];
  keys.forEach(k => {
    const a = before[k], b = after[k];
    if(a === b) return;
    if(a === undefined && (b === '(empty)' || b === 0)) return;   // newly-added optional field
    if(b === undefined && (a === '(empty)' || a === 0)) return;
    changes.push({ field: k, from: a === undefined ? '(none)' : a, to: b === undefined ? '(removed)' : b });
  });
  return changes;
}

function pushLogEntry(entry){
  if(!Array.isArray(state.auditLog)) state.auditLog = [];
  state.auditLog.push(Object.assign({
    id: uid(),
    ts: new Date().toISOString(),
    userId: currentUser ? currentUser.id : null,
    userName: currentUser ? currentUser.name : 'System'
  }, entry));
  if(state.auditLog.length > AUDIT_MAX) state.auditLog.splice(0, state.auditLog.length - AUDIT_MAX);
}

// Auth / user-management events that aren't field edits
function logEvent(module, record, detail){
  pushLogEntry({ module, record, action:'auth', field:'', from:'', to: detail });
}

function recordAuditFromSnapshot(){
  if(!auditSnapshot){ auditSnapshot = takeAuditSnapshot(); return; }
  const next = takeAuditSnapshot();
  const pending = [];

  AUDIT_COLLECTIONS.forEach(def => {
    const before = auditSnapshot.coll[def.key] || {};
    const after  = next.coll[def.key] || {};
    const beforeLabels = auditSnapshot.labels[def.key] || {};
    const afterLabels  = next.labels[def.key] || {};
    const ids = new Set(Object.keys(before).concat(Object.keys(after)));
    ids.forEach(id => {
      if(!(id in before)){
        pending.push({ module:def.module, record:afterLabels[id], action:'create', field:'', from:'', to:'Created ' + def.noun });
      } else if(!(id in after)){
        pending.push({ module:def.module, record:beforeLabels[id], action:'delete', field:'', from:'', to:'Deleted ' + def.noun });
      } else {
        if(beforeLabels[id] !== afterLabels[id]){
          pending.push({ module:def.module, record:afterLabels[id], action:'update', field:'Name', from:beforeLabels[id], to:afterLabels[id] });
        }
        diffFieldMaps(before[id], after[id]).forEach(ch => {
          pending.push({ module:def.module, record:afterLabels[id], action:'update', field:prettyField(ch.field), from:ch.from, to:ch.to });
        });
      }
    });
  });

  diffFieldMaps(auditSnapshot.settings.kpi, next.settings.kpi).forEach(ch => {
    pending.push({ module:'KPI Dashboard', record:'Targets', action:'update', field:prettyField(ch.field), from:ch.from, to:ch.to });
  });
  diffFieldMaps(auditSnapshot.settings.stageDefs, next.settings.stageDefs).forEach(ch => {
    pending.push({ module:'Stage Settings', record:'Stage list', action:'update', field:prettyField(ch.field), from:ch.from, to:ch.to });
  });

  if(pending.length > AUDIT_BURST_LIMIT){
    pushLogEntry({ module:'System', record:'Bulk change', action:'update', field:'',
      from:'', to: pending.length + ' fields changed at once (backup restore or bulk edit)' });
  } else {
    pending.forEach(pushLogEntry);
  }

  auditSnapshot = takeAuditSnapshot();  // re-take: pushing log entries consumed ids
}

/* ---------------------------------------------------------

   Rendered into #authRoot and shown instead of the app whenever
   there is no signed-in user, or when a password change is forced.

const BRAND_LOGO_SRC = (document.querySelector('.brand-logo') || {}).src || '';

function renderAuthScreen(){
  const root = document.getElementById('authRoot');
  const app = document.querySelector('.app');
  if(!root) return;

  if(currentUser && authMode !== 'changePassword'){
    root.innerHTML = '';
    if(app) app.style.display = '';
    return;
  }
  if(app) app.style.display = 'none';

  const logo = BRAND_LOGO_SRC ? `<img class="auth-logo" src="${BRAND_LOGO_SRC}" alt="Eternalgy">` : '';
  const errorHtml = authError ? `<div class="auth-error">${escapeHtml(authError)}</div>` : '';
  const noticeHtml = authNotice ? `<div class="auth-error" style="background:#FCEBC7;border-color:#EBD199;color:#8A5A00;">${escapeHtml(authNotice)}</div>` : '';
  const eye = showLoginPassword ? '🙈' : '👁';
  const pwType = showLoginPassword ? 'text' : 'password';

  if(authMode === 'changePassword'){
    root.innerHTML = `
      <div class="auth-screen">
        <form class="auth-card" id="changePwForm" autocomplete="off">
          ${logo}
          <h2>Choose a new password</h2>
          <p class="auth-sub">You're signing in as <strong>${escapeHtml(currentUser.name)}</strong>. Set your own password before continuing.</p>
          ${errorHtml}
          <div class="auth-field">
            <label for="newPw">New password</label>
            <div class="pw-wrap">
              <input type="${pwType}" id="newPw" autocomplete="new-password" required>
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="${showLoginPassword ? 'Hide' : 'Show'} password" title="${showLoginPassword ? 'Hide' : 'Show'} password">${eye}</button>
            </div>
          </div>
          <div class="auth-field">
            <label for="confirmPw">Confirm new password</label>
            <input type="${pwType}" id="confirmPw" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primary auth-submit" type="submit">Set password and continue</button>
          <p class="auth-hint">Minimum ${PW_MIN_LENGTH} characters.</p>
        </form>
      </div>`;
    attachAuthHandlers();
    return;
  }

  // Credentials are never shown on screen: the administrator hands them out.
  // (The seeded first-run admin account still exists — see ensureDefaultAdmin.)
  const defaultHint = `<p class="auth-hint">Use the username and password given to you by your administrator.</p>`;

  root.innerHTML = `
    <div class="auth-screen">
      <form class="auth-card" id="loginForm" autocomplete="on">
        ${logo}
        <h2>Sign in</h2>
        <p class="auth-sub">Eternalgy C&amp;I Portal — Commercial Department</p>
        ${errorHtml}${noticeHtml}
        <div class="auth-field">
          <label for="loginUser">Username</label>
          <input type="text" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="auth-field">
          <label for="loginPw">Password</label>
          <div class="pw-wrap">
            <input type="${pwType}" id="loginPw" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="${showLoginPassword ? 'Hide' : 'Show'} password" title="${showLoginPassword ? 'Hide' : 'Show'} password">${eye}</button>
          </div>
        </div>
        <button class="btn btn-primary auth-submit" type="submit" id="loginSubmit">Sign in</button>
        ${defaultHint}
      </form>
    </div>`;
  attachAuthHandlers();
}

function attachAuthHandlers(){
  const toggle = document.getElementById('pwToggle');
  toggle && toggle.addEventListener('click', ()=>{
    // Keep the caret where it was so the toggle doesn't interrupt typing.
    const pw = document.getElementById('loginPw') || document.getElementById('newPw');
    const pos = pw ? pw.selectionStart : null;
    showLoginPassword = !showLoginPassword;
    const user = document.getElementById('loginUser');
    const keepUser = user ? user.value : '';
    const keepPw = pw ? pw.value : '';
    const confirm = document.getElementById('confirmPw');
    const keepConfirm = confirm ? confirm.value : '';
    renderAuthScreen();
    const user2 = document.getElementById('loginUser');
    const pw2 = document.getElementById('loginPw') || document.getElementById('newPw');
    const confirm2 = document.getElementById('confirmPw');
    if(user2) user2.value = keepUser;
    if(pw2){
      pw2.value = keepPw;
      pw2.focus();
      if(pos != null){ try{ pw2.setSelectionRange(pos, pos); }catch(err){} }
    }
    if(confirm2) confirm2.value = keepConfirm;
  });

  const loginForm = document.getElementById('loginForm');
  loginForm && loginForm.addEventListener('submit', e=>{
    e.preventDefault();
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPw').value;
    attemptLogin(username, password);
  });

  const changeForm = document.getElementById('changePwForm');
  changeForm && changeForm.addEventListener('submit', e=>{
    e.preventDefault();
    const pw = document.getElementById('newPw').value;
    const confirm = document.getElementById('confirmPw').value;
    if(pw.length < PW_MIN_LENGTH){ authError = `Password must be at least ${PW_MIN_LENGTH} characters.`; renderAuthScreen(); return; }
    if(pw !== confirm){ authError = 'The two passwords do not match.'; renderAuthScreen(); return; }
    setPassword(currentUser, pw);
    currentUser.mustChangePassword = false;
    authError = ''; authMode = 'login'; showLoginPassword = false;
    logEvent('IT Admin', currentUser.username, 'Set a new password');
    saveSharedState();
    auditSnapshot = takeAuditSnapshot();
    renderAuthScreen();
    render();
  });

  const first = document.getElementById('loginUser') || document.getElementById('newPw');
  if(first && !first.value) first.focus();
}

function attemptLogin(username, password){
  const key = normalizeUsername(username);
  const rec = failedAttempts.get(key);
  if(rec && rec.until > Date.now()){
    const secs = Math.ceil((rec.until - Date.now())/1000);
    authError = `Too many failed attempts. Try again in ${secs} second${secs===1?'':'s'}.`;
    renderAuthScreen();
    return;
  }

  const user = findUserByName(username);
  const ok = user && user.active && user.hash === hashPassword(password, user.salt);

  if(!ok){
    // Only restart the counter when a *previous lockout* has run out —
    // rec.until is 0 while merely accumulating failures, which must not
    // be mistaken for an expired lockout.
    const lockoutExpired = rec && rec.until && rec.until <= Date.now();
    const count = (!rec || lockoutExpired) ? 1 : rec.count + 1;
    failedAttempts.set(key, { count, until: count >= LOCKOUT_AFTER ? Date.now() + LOCKOUT_SECONDS*1000 : 0 });
    // Deliberately vague: don't reveal whether the username exists.
    authError = (user && !user.active)
      ? 'That account has been deactivated. Ask an administrator to re-enable it.'
      : 'Incorrect username or password.';
    if(user){
      logEvent('IT Admin', user.username, 'Failed sign-in attempt');
      saveSharedState();
      auditSnapshot = takeAuditSnapshot();
    }
    renderAuthScreen();
    return;
  }

  failedAttempts.delete(key);
  currentUser = user;
  user.lastLogin = new Date().toISOString();
  saveSession(user.id);
  authError = ''; authNotice = ''; showLoginPassword = false;
  logEvent('IT Admin', user.username, 'Signed in');
  saveSharedState();
  auditSnapshot = takeAuditSnapshot();

  if(user.mustChangePassword){
    authMode = 'changePassword';
    renderAuthScreen();
    return;
  }
  authMode = 'login';
  renderAuthScreen();
  render();
}

function signOut(){
  if(currentUser){
    logEvent('IT Admin', currentUser.username, 'Signed out');
    saveSharedState();
    auditSnapshot = takeAuditSnapshot();
  }
  currentUser = null;
  clearSession();
  authMode = 'login'; authError = ''; showLoginPassword = false;
  currentPage = 'pipeline';
  renderAuthScreen();
}

function refreshUserChrome(){

let userModalOpen = false;

function fmtTs(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtDateOnly(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : iso.slice(0,10);
}

function filteredLog(){
  const log = Array.isArray(state.auditLog) ? state.auditLog : [];
  const q = logSearch.trim().toLowerCase();
  return log.filter(e => {
    if(logFilterUser && String(e.userId) !== logFilterUser) return false;
    if(logFilterModule && e.module !== logFilterModule) return false;
    if(logFilterAction && e.action !== logFilterAction) return false;
    const day = (e.ts || '').slice(0,10);
    if(logFilterFrom && day < logFilterFrom) return false;
    if(logFilterTo && day > logFilterTo) return false;
    if(q){
      const hay = [e.userName, e.module, e.record, e.field, e.from, e.to].join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }).reverse();   // newest first
}

function renderLogTab(){
  const all = filteredLog();
  const totalPages = Math.max(1, Math.ceil(all.length / LOG_PAGE_SIZE));
  if(logPage >= totalPages) logPage = totalPages - 1;
  const pageRows = all.slice(logPage*LOG_PAGE_SIZE, (logPage+1)*LOG_PAGE_SIZE);

  const modules = Array.from(new Set((state.auditLog||[]).map(e => e.module))).sort();
  const userOpts = state.users.map(u =>
    `<option value="${u.id}" ${logFilterUser === String(u.id) ? 'selected' : ''}>${escapeHtml(u.name)}</option>`).join('');
  const moduleOpts = modules.map(m =>
    `<option value="${escapeAttr(m)}" ${logFilterModule === m ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('');
  const actionOpts = [['create','Created'],['update','Edited'],['delete','Deleted'],['auth','Sign-in / account']].map(([v,l]) =>
    `<option value="${v}" ${logFilterAction === v ? 'selected' : ''}>${l}</option>`).join('');

  const rows = pageRows.length ? pageRows.map(e => {
    const actionClass = 'action-' + (e.action || 'update');
    const actionLabel = { create:'Created', update:'Edited', delete:'Deleted', auth:'Account' }[e.action] || e.action;
    const detail = e.field
      ? `<div class="diff">
           <span class="diff-val diff-from">${escapeHtml(String(e.from))}</span>
           <span class="diff-arrow">→</span>
           <span class="diff-val diff-to">${escapeHtml(String(e.to))}</span>

      : `<span style="color:var(--ink-soft);">${escapeHtml(String(e.to || ''))}</span>`;
    return `
      <tr>
        <td class="log-time">${fmtTs(e.ts)}</td>
        <td class="log-user">${escapeHtml(e.userName || 'System')}</td>
        <td><span class="action-pill ${actionClass}">${actionLabel}</span></td>
        <td class="log-module">${escapeHtml(e.module || '')}</td>
        <td class="log-record">${escapeHtml(e.record || '')}</td>
        <td class="log-field">${escapeHtml(e.field || '')}</td>
        <td>${detail}</td>
      </tr>`;
  }).join('') : `<tr><td colspan="7" class="empty" style="padding:26px 10px;">No log entries match these filters.</td></tr>`;

  return `
    <div class="panel">
      <div class="log-filters">
        <div class="field"><label>User</label>
          <select id="logFilterUser"><option value="">All users</option>${userOpts}</select></div>
        <div class="field"><label>Module</label>
          <select id="logFilterModule"><option value="">All modules</option>${moduleOpts}</select></div>
        <div class="field"><label>Action</label>
          <select id="logFilterAction"><option value="">All actions</option>${actionOpts}</select></div>
        <div class="field"><label>From</label><input type="date" id="logFilterFrom" value="${escapeAttr(logFilterFrom)}"></div>
        <div class="field"><label>To</label><input type="date" id="logFilterTo" value="${escapeAttr(logFilterTo)}"></div>
        <div class="field"><label>Search</label><input type="text" id="logSearch" placeholder="Record, field, value…" value="${escapeAttr(logSearch)}"></div>
        <div class="field" style="flex:0 0 auto;"><button class="btn btn-ghost" id="logResetBtn">Reset</button></div>
      </div>
    </div>

    <div class="panel">
      <div class="log-table-wrap">
        <table class="log-table">
          <thead><tr>
            <th>When</th><th>User</th><th>Action</th><th>Module</th><th>Record</th><th>Field</th><th>Change</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="log-pager">
        <span class="log-pager-info">
          ${all.length} entr${all.length===1?'y':'ies'}${all.length ? ` · showing ${logPage*LOG_PAGE_SIZE+1}–${Math.min((logPage+1)*LOG_PAGE_SIZE, all.length)}` : ''}
          · log keeps the most recent ${AUDIT_MAX}

        <div style="display:flex; gap:8px; align-items:center;">
          <button class="btn btn-ghost" id="logExportBtn">⬇ Export CSV</button>

          <button class="btn btn-ghost" id="logNextBtn" ${logPage>=totalPages-1?'disabled style="opacity:.4;"':''}>Next →</button>
        </div>
