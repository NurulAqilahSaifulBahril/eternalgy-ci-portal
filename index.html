/* ---------------------------------------------------------
   PAGE — PROJECT MANAGEMENT
--------------------------------------------------------- */
function stageProgress(client){
  const defs = state.stageDefs;
  const done = defs.filter(s => client.stages[s.key]).length;
  return { done, total: defs.length, pct: defs.length ? Math.round((done/defs.length)*100) : 0 };
}

function ringSVG(pct){
  const r = 24, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  const color = pct >= 100 ? '#2E9E6D' : '#F0A93E';
  return `<svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="#DCE6DE" stroke-width="6"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="6"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
      transform="rotate(-90 28 28)"/>
  </svg>`;
}

function renderProjects(){
  const defs = state.stageDefs;
  const q = searchQuery.trim().toLowerCase();
  const filteredClients = !q ? state.clients : state.clients.filter(c =>

    const prog = stageProgress(client);

      const isFinal = i === defs.length-1;
      const done = client.stages[s.key];
      const remark = client.stageRemarks[s.key] || '';
      const remarkOpenKey = `${client.id}:${s.key}`;
      const isOpen = openRemarks.has(remarkOpenKey) || remark.length>0;
      return `

        ${isFinal ? `<div class="final-badge">Final stage</div>` : ''}
        <div class="stage-row" data-toggle-check data-client="${client.id}" data-stage="${s.key}">
          <input type="checkbox" tabindex="-1" ${done?'checked':''}>
          <span class="stage-idx">${String(i+1).padStart(2,'0')}</span>
          <span class="stage-text">${escapeHtml(s.label)}</span>
          <button type="button" class="stage-note-btn ${remark?'has-note':''}" data-toggle-remark="${remarkOpenKey}" title="Remark">📝${remark?'<span class="dot"></span>':''}</button>
        </div>
        ${isOpen ? `<div class="stage-remark-wrap">
          <textarea placeholder="Remark — note down anything unusual for this stage…" data-remark-client="${client.id}" data-remark-stage="${s.key}">${escapeHtml(remark)}</textarea>
        </div>` : ''}
      </div>`;
    }).join('');

    return `
    <div class="client-card">
      <div class="client-card-top">
        <div>
          <p class="client-name">${escapeHtml(client.name)}</p>
          <p class="client-meta">${prog.done} of ${prog.total} stages complete</p>
          ${(client.address || client.agent || client.systemSize || client.quotedPrice) ? `<p class="client-sub-meta">
            ${client.address ? `<span>📍 ${escapeHtml(client.address)}</span>` : ''}
            ${client.agent ? `<span>👤 ${escapeHtml(client.agent)}</span>` : ''}
            ${client.systemSize ? `<span>⚡ ${client.systemSize} kWp</span>` : ''}
            ${client.quotedPrice ? `<span>💰 RM ${client.quotedPrice.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</span>` : ''}
          </p>` : ''}
        </div>
        <div class="ring-wrap">
          <div class="ring">${ringSVG(prog.pct)}<span>${prog.pct}%</span></div>
          <div class="ring-label">Overall<br><b>${prog.pct}%</b> complete</div>
        </div>
      </div>
      <div class="stage-grid">${stageHtml}</div>
      <div class="roof-photos">
        <div class="roof-photos-head">
          <label class="title">Drone Roof Photos</label>
          <label class="btn-upload">📤 Upload photo
            <input type="file" accept="image/*" multiple data-upload-roof="${client.id}" style="display:none;">
          </label>

function renderMaterials(){
  const q = matSearchQuery.trim().toLowerCase();
  const searchClients = !q ? state.clients : state.clients.filter(c =>
    (c.name||'').toLowerCase().includes(q) || (c.address||'').toLowerCase().includes(q)
  );
  if(!currentMaterialsClientId && state.clients.length) currentMaterialsClientId = state.clients[0].id;
  if(q && searchClients.length && !searchClients.some(c=>c.id===currentMaterialsClientId)){
    currentMaterialsClientId = searchClients[0].id;
  }
  const client = state.clients.find(c => c.id === currentMaterialsClientId);
  const chips = searchClients.map(c =>
    `<button type="button" class="client-chip ${c.id===currentMaterialsClientId?'active':''}" data-select-client="${c.id}">${escapeHtml(c.name)}</button>`
  ).join('');

  let body = '';
  if(!state.clients.length){
    body = `<div class="empty">Add a client in Project Management first, then come back to list materials for them.</div>`;
  } else if(q && !searchClients.length){
    body = `<div class="empty">No clients match "${escapeHtml(matSearchQuery)}".</div>`;
  } else if(client){
    const rows = client.materials.map(m => {
      const lineTotal = (m.qty||0) * (m.price||0);
      return `<tr data-mat="${m.id}">
        <td><input type="text" value="${escapeAttr(m.name)}" data-field="name"></td>
        <td><input type="text" value="${escapeAttr(m.supplier||'')}" data-field="supplier" placeholder="Supplier"></td>
        <td><input type="number" min="0" step="1" value="${m.qty}" data-field="qty" style="width:80px;"></td>
        <td><input type="text" value="${escapeAttr(m.unit||'')}" data-field="unit" style="width:80px;" placeholder="pcs"></td>
        <td class="mono"><input type="number" min="0" step="0.01" value="${m.price}" data-field="price" style="width:110px;"></td>
        <td class="mono">RM ${lineTotal.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</td>
        <td><button class="btn-danger" data-remove-mat="${m.id}">Remove</button></td>
      </tr>`;
    }).join('');
    const grandTotal = client.materials.reduce((sum,m)=> sum + (m.qty||0)*(m.price||0), 0);

    const quotedPrice = client.quotedPrice || 0;
    const profit = quotedPrice - grandTotal;
    const marginPct = quotedPrice > 0 ? (profit / quotedPrice * 100) : null;
    const pricePerKwp = client.systemSize > 0 ? (grandTotal / client.systemSize) : null;
    const fmt = n => `RM ${n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}`;

    const missing = [];
    if(!quotedPrice) missing.push('a quoted price');
    if(!client.systemSize) missing.push('system size (kWp)');

    body = `
      <p style="font-size:13px; color:var(--ink-soft); margin:0 0 10px;">Editing materials for <strong style="color:var(--navy);">${escapeHtml(client.name)}</strong></p>
      <div class="panel">
        <table>
          <thead><tr><th>Material</th><th>Supplier</th><th>Qty</th><th>Unit</th><th>Unit price (RM)</th><th>Line total</th><th></th></tr></thead>
          <tbody>
            ${rows || `<tr><td colspan="7" style="color:var(--ink-soft); text-align:center; padding:20px;">No materials listed for this client yet.</td></tr>`}
            <tr class="mat-total-row"><td colspan="5">Grand total</td><td class="mono">${fmt(grandTotal)}</td><td></td></tr>
          </tbody>
        </table>
        <form id="addMatForm" class="row" style="margin-top:16px; align-items:flex-end;">
          <div class="field"><label>Material name</label><input type="text" id="matName" placeholder="e.g. Mounting rail 4.2m" required></div>
          <div class="field"><label>Supplier</label><input type="text" id="matSupplier" placeholder="e.g. ABC Solar Supplies"></div>
          <div class="field" style="max-width:90px;"><label>Qty</label><input type="number" id="matQty" min="0" step="1" value="1" required></div>
          <div class="field" style="max-width:90px;"><label>Unit</label><input type="text" id="matUnit" placeholder="pcs"></div>
          <div class="field" style="max-width:130px;"><label>Unit price (RM)</label><input type="number" id="matPrice" min="0" step="0.01" value="0" required></div>
          <div class="field" style="flex:0;"><button class="btn btn-amber" type="submit">+ Add item</button></div>
        </form>
      </div>
      <div class="panel" style="margin-top:16px;">
        <h3 style="margin:0 0 4px; font-size:15px; color:var(--navy);">Profit Margin Analysis</h3>
        <p style="margin:0 0 4px; font-size:12.5px; color:var(--ink-soft);">Based on this client's quoted price and system size from Module 02.</p>
        ${missing.length ? `<div class="notice" style="margin-top:12px;">Tip: set ${missing.join(' and ')} for this client in <strong>Module 02 → Project Management</strong> to see the full analysis.</div>` : ''}
        <div class="result-strip">
          <div class="result-tile"><div class="val">${quotedPrice ? fmt(quotedPrice) : '—'}</div><div class="lbl">Quoted price</div></div>
          <div class="result-tile"><div class="val">${fmt(grandTotal)}</div><div class="lbl">Material cost</div></div>
          <div class="result-tile"><div class="val" style="${quotedPrice ? `color:${profit<0?'var(--red)':'var(--amber)'};` : ''}">${quotedPrice ? fmt(profit) : '—'}</div><div class="lbl">Gross profit</div></div>
          <div class="result-tile"><div class="val" style="${marginPct!==null ? `color:${marginPct<0?'var(--red)':'var(--amber)'};` : ''}">${marginPct!==null ? marginPct.toFixed(1)+'%' : '—'}</div><div class="lbl">Profit margin</div></div>
          <div class="result-tile"><div class="val">${pricePerKwp!==null ? fmt(pricePerKwp) : '—'}</div><div class="lbl">Material cost / kWp</div></div>
        </div>
      </div>`;
  }

  return `
    <div class="page-head">
      <div>
        <p class="eyebrow">Module 03</p>
        <h2>Material List</h2>
        <p>Quantity, supplier and pricing of materials required for each client's installation, with profit margin at a glance.</p>
      </div>
      <button class="btn btn-ghost" type="button" data-pdf-export-btn>⬇ Export as PDF</button>
    </div>
    <div class="panel" style="margin-bottom:18px;">
      <div class="client-search-row">
        <input type="search" id="matSearchInput" placeholder="🔍 Search by site / client name or address…" value="${escapeAttr(matSearchQuery)}">
        <button class="btn btn-ghost" type="button" id="matSearchBtn">Search</button>
        ${matSearchQuery ? `<button class="btn btn-ghost" type="button" id="matSearchClearBtn">✕ Clear</button>` : ''}
      </div>
      <div class="client-picker-row">${chips || '<span style="font-size:12.5px;color:var(--ink-soft);">No matches</span>'}</div>
    </div>
    ${body}
  `;
}

const PIPE_STAGES = ['New Lead','Site Survey','Proposal Sent','Negotiation','Closed Won'];
const SCHEME_OPTIONS = ['ATAP','CRESS','SELCO','Direct Purchase','PPA / RPVI','Other'];

function pipelineDashboardStats(){
  const leads = state.leads;
  const closedWon = leads.filter(l=>l.stage==='Closed Won');
  const open = leads.filter(l=>l.stage!=='Closed Won');
  const pastProposal = leads.filter(l=>['Proposal Sent','Negotiation','Closed Won'].includes(l.stage));

  const totalDeals = leads.length;
  const pipelineValue = open.reduce((sum,l)=>sum+(l.projectAmount||0),0);
  const closedSales = closedWon.reduce((sum,l)=>sum+(l.projectAmount||0),0);
  const winRate = pastProposal.length ? (closedWon.length/pastProposal.length)*100 : 0;
  const weightedForecast = open.reduce((sum,l)=>sum+((l.projectAmount||0)*((l.probability||0)/100)),0);
  const kwLeads = leads.filter(l=>l.kw>0);
  const totalKw = kwLeads.reduce((sum,l)=>sum+(l.kw||0),0);
  const totalRmForKw = kwLeads.reduce((sum,l)=>sum+(l.projectAmount||0),0);
  const avgRmPerKw = totalKw>0 ? totalRmForKw/totalKw : 0;
  const rm = n => 'RM ' + Math.round(n||0).toLocaleString();

  return `
    <div class="kpi-grid">
      <div class="kpi-tile"><p class="kpi-label">Total Deals</p><div class="kpi-value">${totalDeals}</div></div>
      <div class="kpi-tile"><p class="kpi-label">Pipeline Value</p><div class="kpi-value">${rm(pipelineValue)}</div><p class="kpi-target">${open.length} open deal(s)</p></div>
      <div class="kpi-tile"><p class="kpi-label">Closed Sales</p><div class="kpi-value">${rm(closedSales)}</div><p class="kpi-target">${closedWon.length} closed won</p></div>
      <div class="kpi-tile"><p class="kpi-label">Win Rate</p><div class="kpi-value">${winRate.toFixed(1)}%</div></div>
      <div class="kpi-tile"><p class="kpi-label">Weighted Forecast</p><div class="kpi-value">${rm(weightedForecast)}</div></div>
      <div class="kpi-tile"><p class="kpi-label">Avg RM/kWp</p><div class="kpi-value">${rm(avgRmPerKw)}</div></div>
    </div>`;
}

        <button class="btn btn-amber" type="button" id="newDealBtn">+ New Deal</button>

--------------------------------------------------------- */
function renderDesign(){
  return `
    <div class="page-head">
      <div>
        <p class="eyebrow">Module 04</p><h2>Solar Design</h2>
        <p>Quick sizing estimate based on monthly consumption and site conditions. Use for early-stage proposals — confirm with a full shading and structural study before quoting.</p>
      </div>
      <button class="btn btn-ghost" type="button" data-pdf-export-btn>⬇ Export as PDF</button>
    </div>
    <div class="panel">
      <div class="row">
        <div class="field"><label>Avg. monthly consumption (kWh)</label><input type="number" id="dsConsumption" min="0" value="2500"></div>
        <div class="field"><label>Peak sun hours / day</label><input type="number" id="dsPSH" min="1" step="0.1" value="3.8"></div>
        <div class="field"><label>Panel wattage (Wp)</label><input type="number" id="dsPanelW" min="1" value="550"></div>
        <div class="field"><label>System losses (%)</label><input type="number" id="dsLoss" min="0" max="50" value="15"></div>
      </div>
      <button class="btn btn-primary" id="dsCalcBtn">Calculate system size</button>
      <div id="dsResults"></div>
    </div>
  `;
}
function calcDesign(){
  const consumption = parseFloat(document.getElementById('dsConsumption').value) || 0;
  const psh = parseFloat(document.getElementById('dsPSH').value) || 1;
  const panelW = parseFloat(document.getElementById('dsPanelW').value) || 1;
  const lossPct = parseFloat(document.getElementById('dsLoss').value) || 0;
  const dailyKwh = consumption / 30;
  const derate = 1 - (lossPct/100);
  const systemKw = dailyKwh / (psh * derate);
  const panelCount = Math.ceil((systemKw*1000) / panelW);
  const actualKw = (panelCount * panelW)/1000;
  const annualGen = actualKw * psh * 365 * derate;
  document.getElementById('dsResults').innerHTML = `
    <div class="result-strip">
      <div class="result-tile"><div class="val">${actualKw.toFixed(2)} kWp</div><div class="lbl">Recommended system size</div></div>
      <div class="result-tile"><div class="val">${panelCount}</div><div class="lbl">Panels required</div></div>
      <div class="result-tile"><div class="val">${Math.round(annualGen).toLocaleString()} kWh</div><div class="lbl">Estimated annual generation</div></div>
    </div>`;
}

/* ---------------------------------------------------------
   PAGE — SAVINGS ANALYSIS
--------------------------------------------------------- */
function renderSavings(){
  return `
    <div class="page-head">
      <div>
        <p class="eyebrow">Module 05</p><h2>Savings Analysis</h2>
        <p>Estimate payback period and long-term savings for a client proposal.</p>
      </div>
      <button class="btn btn-ghost" type="button" data-pdf-export-btn>⬇ Export as PDF</button>
    </div>
    <div class="panel">
      <div class="row">
        <div class="field"><label>System cost (RM)</label><input type="number" id="svCost" min="0" value="45000"></div>
        <div class="field"><label>Current monthly bill (RM)</label><input type="number" id="svBill" min="0" value="1800"></div>
        <div class="field"><label>Bill offset (%)</label><input type="number" id="svOffset" min="0" max="100" value="80"></div>
        <div class="field"><label>Tariff escalation / year (%)</label><input type="number" id="svEsc" min="0" step="0.1" value="3"></div>
      </div>
      <button class="btn btn-primary" id="svCalcBtn">Calculate savings</button>
      <div id="svResults"></div>
    </div>
  `;
}
function calcSavings(){
  const cost = parseFloat(document.getElementById('svCost').value) || 0;
  const bill = parseFloat(document.getElementById('svBill').value) || 0;
  const offset = (parseFloat(document.getElementById('svOffset').value) || 0)/100;
  const esc = (parseFloat(document.getElementById('svEsc').value) || 0)/100;
  const monthlySaving = bill * offset;
  const yearlySaving = monthlySaving * 12;
  const paybackYears = yearlySaving > 0 ? cost / yearlySaving : Infinity;
  let cumulative = 0, year25 = 0;
  for(let y=1; y<=25; y++){ cumulative += yearlySaving * Math.pow(1+esc, y-1); if(y===25) year25 = cumulative; }
  const netSaving25 = year25 - cost;
  document.getElementById('svResults').innerHTML = `
    <div class="result-strip">
      <div class="result-tile"><div class="val">RM ${monthlySaving.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="lbl">Estimated monthly saving</div></div>
      <div class="result-tile"><div class="val">${isFinite(paybackYears) ? paybackYears.toFixed(1)+' yrs' : '—'}</div><div class="lbl">Simple payback period</div></div>
      <div class="result-tile"><div class="val">RM ${Math.round(netSaving25).toLocaleString()}</div><div class="lbl">Net saving over 25 years</div></div>
    </div>`;
}

/* ---------------------------------------------------------
   PAGE — MODULE 08: KPI C&I DEPARTMENT
--------------------------------------------------------- */
function calcKPI(){
  const closedWon = state.leads.filter(l=>l.stage==='Closed Won');
  const actualSales = closedWon.reduce((sum,l)=>sum+(l.projectAmount||0),0);
  const totalSystemInstall = closedWon.reduce((sum,l)=>sum+(l.kw||0),0);
  const target = state.kpi.yearlyTargetSales||0;
  const pctOfTarget = target>0 ? (actualSales/target)*100 : 0;

  const qualifiedLeads = state.leads.filter(l=>l.qualified);
  const qualifiedPipelineSize = qualifiedLeads.reduce((sum,l)=>sum+(l.projectAmount||0),0);
  const qualifiedPipelineTarget = target * (state.kpi.qualifiedPipelineMultiplier||3);

  const pastProposal = state.leads.filter(l=>['Proposal Sent','Negotiation','Closed Won'].includes(l.stage));
  const winRate = pastProposal.length ? (closedWon.length/pastProposal.length)*100 : 0;

  const pastSiteVisit = state.leads.filter(l=>['Site Survey','Proposal Sent','Negotiation','Closed Won'].includes(l.stage));
  const siteVisitToProposalRate = pastSiteVisit.length ? (pastProposal.length/pastSiteVisit.length)*100 : 0;

  return { actualSales, totalSystemInstall, target, pctOfTarget, qualifiedPipelineSize, qualifiedPipelineTarget, winRate, siteVisitToProposalRate, closedWonCount: closedWon.length };
}

function kpiBarClass(pct, min, max){
  if(max!==undefined){ return (pct>=min && pct<=max) ? 'good' : (pct<min ? 'bad' : ''); }
  return pct>=min ? 'good' : (pct < min*0.6 ? 'bad' : '');
}

/* Simple inline SVG bar chart comparing Actual Sales vs Target Sales —
   no external chart library needed, works fully offline. */
function salesComparisonChartSVG(actual, target){
  const w = 520, h = 220, padTop = 20, padBottom = 34, padLeft = 90, padRight = 30;
  const chartH = h - padTop - padBottom;
  const maxVal = Math.max(actual, target, 1) * 1.15;
  const barW = 90;
  const gap = 70;
  const groupStartX = padLeft + 30;
  const rm = n => 'RM ' + Math.round(n||0).toLocaleString();

  const bars = [
    { label:'Target', value: target, color:'#B7CFC7' },
    { label:'Actual',  value: actual, color: actual>=target ? '#2E9E6D' : '#F0A93E' },
  ];

  const barsSVG = bars.map((b,i)=>{
    const barH = maxVal>0 ? (b.value/maxVal)*chartH : 0;
    const x = groupStartX + i*(barW+gap);
    const y = padTop + (chartH - barH);
    return `
      <text x="${x+barW/2}" y="${y-10}" text-anchor="middle" font-size="13" font-weight="700" fill="#0F3D38">${rm(b.value)}</text>
      <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="6" fill="${b.color}"></rect>
      <text x="${x+barW/2}" y="${h-padBottom+22}" text-anchor="middle" font-size="12.5" fill="#5E7069">${b.label}</text>
    `;
  }).join('');

  // baseline + a couple of horizontal gridlines
  const gridLines = [0.5, 1].map(f=>{
    const y = padTop + chartH - (chartH*f);
    const val = maxVal*f;
    return `<line x1="${padLeft}" y1="${y}" x2="${w-padRight}" y2="${y}" stroke="#DCE6DE" stroke-width="1"/>
      <text x="${padLeft-10}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#84988D">${rm(val)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}
    <line x1="${padLeft}" y1="${padTop+chartH}" x2="${w-padRight}" y2="${padTop+chartH}" stroke="#C6D3C9" stroke-width="1.5"/>
    ${barsSVG}
  </svg>`;
}

function attachPageHandlers(){
  if(currentPage === 'itadmin') attachITAdminHandlers();
  const gotoBtn = document.getElementById('gotoSettingsBtn');
  gotoBtn && gotoBtn.addEventListener('click', ()=>{ currentPage='stageSettings'; render(); });
  document.querySelectorAll('button[data-page="projects"]').forEach(b=> b.addEventListener('click', ()=>{ currentPage='projects'; render(); }));

  if(currentPage === 'projects'){
    const form = document.getElementById('addClientForm');
    form && form.addEventListener('submit', e=>{
      e.preventDefault();
      const name = document.getElementById('newClientName').value.trim();
      const address = document.getElementById('newClientAddress').value.trim();
      const agent = document.getElementById('newClientAgent').value.trim();
      const systemSize = parseFloat(document.getElementById('newClientSize').value) || 0;
      const quotedPrice = parseFloat(document.getElementById('newClientPrice').value) || 0;
      if(!name) return;
      state.clients.push({
        id: uid(), name, address, agent, systemSize, quotedPrice,
        stages: buildStages(state.stageDefs), stageRemarks: buildRemarks(state.stageDefs),
        materials: [], roofPhotos: []
      });
      commit();
    });
    const searchInput = document.getElementById('clientSearchInput');
    const searchBtn = document.getElementById('clientSearchBtn');
    const searchClearBtn = document.getElementById('clientSearchClearBtn');
    searchBtn && searchBtn.addEventListener('click', ()=>{
      searchQuery = searchInput.value.trim();
      render();
    });
    searchInput && searchInput.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); searchQuery = searchInput.value.trim(); render(); }
    });
    searchClearBtn && searchClearBtn.addEventListener('click', ()=>{
      searchQuery = '';
      render();
    });
    document.querySelectorAll('input[data-upload-roof]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const clientId = parseInt(inp.dataset.uploadRoof);
        const client = state.clients.find(c=>c.id===clientId);
        if(!client) return;
        const files = Array.from(inp.files || []);
        if(!files.length) return;
        if(!client.roofPhotos) client.roofPhotos = [];
        for(const file of files){
          try{
            const dataUrl = await readAndCompressImage(file);
            client.roofPhotos.push({ id: uid(), name: file.name, dataUrl });
          }catch(err){ console.error('Photo upload failed', err); }
        }
        commit();
      });
    });
    document.querySelectorAll('[data-remove-photo]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const [clientIdStr, photoIdStr] = btn.dataset.removePhoto.split(':');
        const client = state.clients.find(c=>c.id===parseInt(clientIdStr));
        if(!client) return;
        client.roofPhotos = (client.roofPhotos||[]).filter(p=>p.id!==parseInt(photoIdStr));
        commit();
      });
    });
    document.querySelectorAll('[data-toggle-check]').forEach(row=>{
      row.addEventListener('click', e=>{
        if(e.target.closest('[data-toggle-remark]')) return;
        const clientId = parseInt(row.dataset.client);
        const stageKey = row.dataset.stage;
        const client = state.clients.find(c=>c.id===clientId);
        client.stages[stageKey] = !client.stages[stageKey];
        commit();
      });
    });
    document.querySelectorAll('[data-toggle-remark]').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const key = btn.dataset.toggleRemark;
        if(openRemarks.has(key)) openRemarks.delete(key); else openRemarks.add(key);
        render();
      });
    });
    document.querySelectorAll('textarea[data-remark-client]').forEach(ta=>{
      ta.addEventListener('change', ()=>{
        const client = state.clients.find(c=>c.id===parseInt(ta.dataset.remarkClient));
        client.stageRemarks[ta.dataset.remarkStage] = ta.value;
        commit();
      });
    });
    document.querySelectorAll('[data-remove-client]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = parseInt(btn.dataset.removeClient);
        if(confirm('Remove this client and all their data?')){
          state.clients = state.clients.filter(c=>c.id!==id);
          commit();
        }
      });
    });
  }

  if(currentPage === 'stageSettings'){
    document.querySelectorAll('[data-rename]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const def = state.stageDefs.find(d=>d.key===inp.dataset.rename);
        def.label = inp.value.trim() || def.label;
        commit();
      });
    });
    document.querySelectorAll('[data-move]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.dataset.idx);
        const dir = btn.dataset.move;
        const swapWith = dir==='up' ? idx-1 : idx+1;
        if(swapWith<0 || swapWith>=state.stageDefs.length) return;
        const arr = state.stageDefs;
        [arr[idx], arr[swapWith]] = [arr[swapWith], arr[idx]];
        commit();
      });
    });
    document.querySelectorAll('[data-delete-stage]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(state.stageDefs.length<=1) return;
        const key = btn.dataset.deleteStage;
        if(!confirm('Remove this stage? Its tick status and remarks will be removed from every client.')) return;
        state.stageDefs = state.stageDefs.filter(d=>d.key!==key);
        state.clients.forEach(c=>{ delete c.stages[key]; delete c.stageRemarks[key]; });
        commit();
      });
    });
    const addForm = document.getElementById('addStageForm');
    addForm && addForm.addEventListener('submit', e=>{
      e.preventDefault();
      const label = document.getElementById('newStageLabel').value.trim();
      if(!label) return;
      const key = 'stage_' + uid();
      state.stageDefs.push({ key, label });
      state.clients.forEach(c=>{ c.stages[key]=false; c.stageRemarks[key]=''; });
      commit();
    });
  }

  if(currentPage === 'materials'){
    document.querySelectorAll('[data-select-client]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        currentMaterialsClientId = parseInt(chip.dataset.selectClient);
        render();
      });
    });
    const matSearchInput = document.getElementById('matSearchInput');
    const matSearchBtn = document.getElementById('matSearchBtn');
    const matSearchClearBtn = document.getElementById('matSearchClearBtn');
    matSearchBtn && matSearchBtn.addEventListener('click', ()=>{
      matSearchQuery = matSearchInput.value.trim();
      render();
    });
    matSearchInput && matSearchInput.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); matSearchQuery = matSearchInput.value.trim(); render(); }
    });
    matSearchClearBtn && matSearchClearBtn.addEventListener('click', ()=>{
      matSearchQuery = '';
      render();
    });
    const addForm = document.getElementById('addMatForm');
    addForm && addForm.addEventListener('submit', e=>{
      e.preventDefault();
      const client = state.clients.find(c=>c.id===currentMaterialsClientId);
      const name = document.getElementById('matName').value.trim();
      const supplier = document.getElementById('matSupplier').value.trim();
      const qty = parseFloat(document.getElementById('matQty').value)||0;
      const unit = document.getElementById('matUnit').value.trim();
      const price = parseFloat(document.getElementById('matPrice').value)||0;
      if(!name) return;
      client.materials.push({ id: uid(), name, supplier, qty, unit, price });
      commit();
    });
    document.querySelectorAll('[data-remove-mat]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const client = state.clients.find(c=>c.id===currentMaterialsClientId);
        client.materials = client.materials.filter(m=>m.id!==parseInt(btn.dataset.removeMat));
        commit();
      });
    });
    document.querySelectorAll('tr[data-mat] input').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const tr = inp.closest('tr');
        const matId = parseInt(tr.dataset.mat);
        const client = state.clients.find(c=>c.id===currentMaterialsClientId);
        const mat = client.materials.find(m=>m.id===matId);
        const field = inp.dataset.field;
        mat[field] = (field==='qty'||field==='price') ? parseFloat(inp.value)||0 : inp.value;
        commit();
      });
    });
  }

  if(currentPage === 'pipeline'){
    const searchInput = document.getElementById('pipelineSearchInput');
    const searchBtn = document.getElementById('pipelineSearchBtn');
    const searchClearBtn = document.getElementById('pipelineSearchClearBtn');
    searchBtn && searchBtn.addEventListener('click', ()=>{ pipelineSearchQuery = searchInput.value.trim(); render(); });
    searchInput && searchInput.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); pipelineSearchQuery = searchInput.value.trim(); render(); }
    });
    searchClearBtn && searchClearBtn.addEventListener('click', ()=>{ pipelineSearchQuery = ''; render(); });

    const newDealBtn = document.getElementById('newDealBtn');
    newDealBtn && newDealBtn.addEventListener('click', ()=>{ editingLeadId = null; dealModalOpen = true; render(); });

    document.querySelectorAll('[data-edit-deal]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        editingLeadId = parseInt(btn.dataset.editDeal);
        dealModalOpen = true;
        render();
      });
    });

    document.querySelectorAll('[data-see-deal-report]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        dealReportViewId = parseInt(btn.dataset.seeDealReport);
        render();
      });
    });

    document.querySelectorAll('select[data-lead]').forEach(sel=>{
      sel.addEventListener('click', e=> e.stopPropagation());
      sel.addEventListener('change', e=>{
        e.stopPropagation();
        const lead = state.leads.find(l=>l.id===parseInt(sel.dataset.lead));
        lead.stage = sel.value;
        // Reaching "Closed Won" auto-creates the matching Module 02 client
        // so the site's progress can be tracked for the HOD right away.
        maybeConvertToProjectClient(lead);
        commit();
      });
    });

    if(dealReportViewId){
      const closeView = ()=>{ dealReportViewId = null; render(); };
      const viewOverlay = document.getElementById('dealReportViewOverlay');
      viewOverlay && viewOverlay.addEventListener('click', e=>{ if(e.target === viewOverlay) closeView(); });
      document.querySelectorAll('#dealReportViewCloseBtn, #dealReportCloseBtn2').forEach(b=> b.addEventListener('click', closeView));
      const pdfBtn = document.getElementById('dealReportPdfBtn');
      pdfBtn && pdfBtn.addEventListener('click', ()=>{
        const printArea = document.getElementById('printArea');
        const l = state.leads.find(x=>x.id===dealReportViewId);
        if(printArea) printDocument(`Deal Report — ${l ? l.name : ''}`, printArea.innerHTML);
      });
      const editFromView = document.getElementById('dealReportEditBtn');
      editFromView && editFromView.addEventListener('click', ()=>{
        editingLeadId = dealReportViewId;
        dealReportViewId = null;
        dealModalOpen = true;
        render();
      });
    }

    if(dealModalOpen){
      const overlay = document.getElementById('dealModalOverlay');
      const closeModal = ()=>{ dealModalOpen = false; editingLeadId = null; render(); };
      document.getElementById('dealModalCloseBtn') && document.getElementById('dealModalCloseBtn').addEventListener('click', closeModal);
      document.getElementById('dealCancelBtn') && document.getElementById('dealCancelBtn').addEventListener('click', closeModal);
      overlay && overlay.addEventListener('click', e=>{ if(e.target === overlay) closeModal(); });

      const linkSelect = document.getElementById('dealLinkClient');
      linkSelect && linkSelect.addEventListener('change', ()=>{
        const client = state.clients.find(c=>c.id===parseInt(linkSelect.value));
        if(!client) return;
        document.getElementById('dealName').value = client.name || '';
        document.getElementById('dealAddress').value = client.address || '';
        document.getElementById('dealAgent').value = client.agent || '';
        if(client.systemSize) document.getElementById('dealKw').value = client.systemSize;
        if(client.quotedPrice) document.getElementById('dealAmount').value = client.quotedPrice;

      const dealSaveBtn = document.getElementById('dealSaveBtn');
      dealSaveBtn && dealSaveBtn.addEventListener('click', ()=>{
        const errorMsg = document.getElementById('dealFormError');
        const data = {
          name: document.getElementById('dealName').value.trim(),
          contactPerson: document.getElementById('dealContact').value.trim(),
          phone: document.getElementById('dealPhone').value.trim(),
          email: document.getElementById('dealEmail').value.trim(),
          address: document.getElementById('dealAddress').value.trim(),
          agent: document.getElementById('dealAgent').value.trim(),
          projectAmount: parseFloat(document.getElementById('dealAmount').value) || 0,
          kw: parseFloat(document.getElementById('dealKw').value) || 0,
          scheme: document.getElementById('dealScheme').value,
          stage: document.getElementById('dealStage').value,
          expectedCloseDate: document.getElementById('dealCloseDate').value,
          probability: parseFloat(document.getElementById('dealProbability').value) || 0,
          notes: document.getElementById('dealNotes').value.trim(),
          qualified: document.getElementById('dealQualified').checked,
        };
        if(!data.name){
          if(errorMsg) errorMsg.style.display = 'block';
          document.getElementById('dealName').focus();
          return;
        }
        let lead;
        if(editingLeadId){
          lead = state.leads.find(l=>l.id===editingLeadId);
          Object.assign(lead, data);
        } else {
          lead = { id: uid(), ...data, panelLayouts: [], proposalFile: null, convertedClientId: null };
          state.leads.push(lead);
        }
        // Reaching "Closed Won" auto-creates the matching Module 02 client
        // so the site's progress can be tracked for the HOD right away.
        maybeConvertToProjectClient(lead);
        dealModalOpen = false;
        editingLeadId = null;
        commit();
      });

      const deleteBtn = document.getElementById('dealDeleteBtn');
      deleteBtn && deleteBtn.addEventListener('click', ()=>{
        if(!confirm('Delete this deal? This cannot be undone.')) return;
        state.leads = state.leads.filter(l=>l.id!==editingLeadId);
        dealModalOpen = false;
        editingLeadId = null;
        commit();
      });

      document.querySelectorAll('input[data-upload-drawing]').forEach(inp=>{
        inp.addEventListener('change', async ()=>{
          const leadId = parseInt(inp.dataset.uploadDrawing);
          const lead = state.leads.find(l=>l.id===leadId);
          if(!lead) return;
          const files = Array.from(inp.files || []);
          if(!files.length) return;
          if(!lead.panelLayouts) lead.panelLayouts = [];
          for(const file of files){
            try{
              const dataUrl = await readAndCompressImage(file);
              lead.panelLayouts.push({ id: uid(), name: file.name, dataUrl });
            }catch(err){ console.error('Drawing upload failed', err); }
          }
          commit();
        });
      });
      document.querySelectorAll('[data-remove-drawing]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const [leadIdStr, photoIdStr] = btn.dataset.removeDrawing.split(':');
          const lead = state.leads.find(l=>l.id===parseInt(leadIdStr));
          if(!lead) return;
          lead.panelLayouts = (lead.panelLayouts||[]).filter(p=>p.id!==parseInt(photoIdStr));
          commit();
        });
      });

      document.querySelectorAll('input[data-upload-proposal]').forEach(inp=>{
        inp.addEventListener('change', async ()=>{
          const leadId = parseInt(inp.dataset.uploadProposal);
          const lead = state.leads.find(l=>l.id===leadId);
          if(!lead) return;
          const file = inp.files && inp.files[0];
          if(!file) return;
          if(file.type !== 'application/pdf'){
            alert('Please upload a PDF file.');
            inp.value = '';
            return;
          }
          if(file.size > 4*1024*1024){
            alert('That PDF is too large — please keep the final proposal under 4MB.');
            inp.value = '';
            return;
          }
          try{
            const dataUrl = await readFileAsDataUrl(file);
            lead.proposalFile = { name: file.name, dataUrl };
            commit();
            render();
          }catch(err){
            console.error('Proposal upload failed', err);
            alert('Could not read that file — please try again.');
          }
        });
      });
      document.querySelectorAll('[data-remove-proposal]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const lead = state.leads.find(l=>l.id===parseInt(btn.dataset.removeProposal));
          if(!lead) return;
          lead.proposalFile = null;
          commit();
          render();
        });
      });
    }

  if(currentPage === 'design') document.getElementById('dsCalcBtn').addEventListener('click', calcDesign);
  if(currentPage === 'savings') document.getElementById('svCalcBtn').addEventListener('click', calcSavings);

      const dateReturned = document.getElementById('newGitaDateReturned').value;

        id: uid(), name, pic, agent, status, notes, dateReceived, dateReturned,

      });
      showAddGitaForm = false;
      commit();

    const searchBtn = document.getElementById('gitaSearchBtn');
    const searchClearBtn = document.getElementById('gitaSearchClearBtn');
    searchBtn && searchBtn.addEventListener('click', ()=>{ gitaSearchQuery = searchInput.value.trim(); render(); });
    searchInput && searchInput.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); gitaSearchQuery = searchInput.value.trim(); render(); }
    });
    searchClearBtn && searchClearBtn.addEventListener('click', ()=>{ gitaSearchQuery = ''; render(); });

      sel.addEventListener('change', ()=>{
        const g = state.gitaCustomers.find(x=>x.id===parseInt(sel.dataset.gitaStatus));
        if(!g) return;
        g.status = sel.value;
        commit();
      });
    });
    document.querySelectorAll('[data-gita-pic]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const g = state.gitaCustomers.find(x=>x.id===parseInt(inp.dataset.gitaPic));
        if(!g) return;
        g.pic = inp.value.trim();
        commit();
      });
    });
    document.querySelectorAll('[data-gita-notes]').forEach(ta=>{
      ta.addEventListener('change', ()=>{
        const g = state.gitaCustomers.find(x=>x.id===parseInt(ta.dataset.gitaNotes));
        if(!g) return;
        g.notes = ta.value;
        commit();
      });
    });
    document.querySelectorAll('[data-gita-agent]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const g = state.gitaCustomers.find(x=>x.id===parseInt(inp.dataset.gitaAgent));
        if(!g) return;
        g.agent = inp.value.trim();
        commit();
      });
    });
    document.querySelectorAll('[data-gita-date-received]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const g = state.gitaCustomers.find(x=>x.id===parseInt(inp.dataset.gitaDateReceived));
        if(!g) return;
        g.dateReceived = inp.value;
        commit();
      });
    });
    document.querySelectorAll('[data-gita-date-returned]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const g = state.gitaCustomers.find(x=>x.id===parseInt(inp.dataset.gitaDateReturned));
        if(!g) return;
        g.dateReturned = inp.value;
        commit();
      });
    });
    document.querySelectorAll('[data-remove-gita]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!confirm('Remove this customer from the GITA checklist?')) return;
        state.gitaCustomers = state.gitaCustomers.filter(x=>x.id!==parseInt(btn.dataset.removeGita));
        commit();
      });
    });
  }

  /* ---- MODULE 07: SUMMARY INSTALLATION REPORT ---- */
  if(currentPage === 'installReports'){
    const newBtn = document.getElementById('newReportBtn');
    newBtn && newBtn.addEventListener('click', ()=>{ editingReportId = null; reportModalOpen = true; render(); });

    const searchInput = document.getElementById('reportSearchInput');
    const searchBtn = document.getElementById('reportSearchBtn');
    const searchClearBtn = document.getElementById('reportSearchClearBtn');
    searchBtn && searchBtn.addEventListener('click', ()=>{ reportSearchQuery = searchInput.value.trim(); render(); });
    searchInput && searchInput.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); reportSearchQuery = searchInput.value.trim(); render(); }
    });
    searchClearBtn && searchClearBtn.addEventListener('click', ()=>{ reportSearchQuery = ''; render(); });

    document.querySelectorAll('[data-edit-report]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        editingReportId = parseInt(btn.dataset.editReport);
        reportModalOpen = true;
        render();
      });
    });
    document.querySelectorAll('[data-see-report]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        reportViewId = parseInt(btn.dataset.seeReport);
        render();
      });
    });

    if(reportViewId){
      const closeView = ()=>{ reportViewId = null; render(); };
      const viewOverlay = document.getElementById('reportViewOverlay');
      viewOverlay && viewOverlay.addEventListener('click', e=>{ if(e.target === viewOverlay) closeView(); });
      document.querySelectorAll('#reportViewCloseBtn, #reportViewCloseBtn2').forEach(b=> b.addEventListener('click', closeView));
      const pdfBtn = document.getElementById('reportViewPdfBtn');
      pdfBtn && pdfBtn.addEventListener('click', ()=>{
        const printArea = document.getElementById('printArea');
        if(printArea) printDocument(`Installation Report — ${state.installReports.find(x=>x.id===reportViewId)?.siteName || ''}`, printArea.innerHTML);
      });
      const editFromView = document.getElementById('reportViewEditBtn');
      editFromView && editFromView.addEventListener('click', ()=>{
        editingReportId = reportViewId;
        reportViewId = null;
        reportModalOpen = true;
        render();
      });
    }

    if(reportModalOpen){
      const closeModal = ()=>{ reportModalOpen = false; editingReportId = null; render(); };
      const overlay = document.getElementById('reportModalOverlay');
      overlay && overlay.addEventListener('click', e=>{ if(e.target === overlay) closeModal(); });
      document.getElementById('reportModalCloseBtn') && document.getElementById('reportModalCloseBtn').addEventListener('click', closeModal);
      document.getElementById('reportCancelBtn') && document.getElementById('reportCancelBtn').addEventListener('click', closeModal);

      const saveBtn = document.getElementById('reportSaveBtn');
      saveBtn && saveBtn.addEventListener('click', ()=>{
        const errorMsg = document.getElementById('reportFormError');
        const data = {
          siteName: document.getElementById('reportSiteName').value.trim(),
          agent: document.getElementById('reportAgent').value.trim(),
          address: document.getElementById('reportAddress').value.trim(),
          dateInstallation: document.getElementById('reportDate').value,
          supervisor: document.getElementById('reportSupervisor').value.trim(),
          wiringTeam: document.getElementById('reportWiringTeam').value.trim(),
          installerTeam: document.getElementById('reportInstallerTeam').value.trim(),
          summary: document.getElementById('reportSummary').value.trim(),
        };
        if(!data.siteName){
          if(errorMsg) errorMsg.style.display = 'block';
          document.getElementById('reportSiteName').focus();
          return;
        }
        if(editingReportId){
          const r = state.installReports.find(x=>x.id===editingReportId);
          Object.assign(r, data);
        } else {
          const newReport = { id: uid(), ...data, photos: [] };
          state.installReports.push(newReport);
          editingReportId = newReport.id;
        }
        commit();
        render();
      });

      const deleteBtn = document.getElementById('reportDeleteBtn');
      deleteBtn && deleteBtn.addEventListener('click', ()=>{
        if(!confirm('Delete this installation report? This cannot be undone.')) return;
        state.installReports = state.installReports.filter(x=>x.id!==editingReportId);
        reportModalOpen = false;
        editingReportId = null;
        commit();
      });

      document.querySelectorAll('input[data-upload-report-photo]').forEach(inp=>{
        inp.addEventListener('change', async ()=>{
          const reportId = parseInt(inp.dataset.uploadReportPhoto);
          const r = state.installReports.find(x=>x.id===reportId);
          if(!r) return;
          const files = Array.from(inp.files || []);
          if(!files.length) return;
          if(!r.photos) r.photos = [];
          for(const file of files){
            try{
              const dataUrl = await readAndCompressImage(file);
              r.photos.push({ id: uid(), name: file.name, dataUrl });
            }catch(err){ console.error('Photo upload failed', err); }
          }
          commit();
          render();
        });
      });
      document.querySelectorAll('[data-remove-report-photo]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const [reportIdStr, photoIdStr] = btn.dataset.removeReportPhoto.split(':');
          const r = state.installReports.find(x=>x.id===parseInt(reportIdStr));
          if(!r) return;
          r.photos = (r.photos||[]).filter(p=>p.id!==parseInt(photoIdStr));
          commit();
          render();
        });
      });
    }
  }

  /* ---- MODULE 08: KPI DASHBOARD ---- */
  if(currentPage === 'kpi'){
    const bindNum = (id, key, isKpiObj)=>{
      const el = document.getElementById(id);
      el && el.addEventListener('change', ()=>{
        const val = parseFloat(el.value) || 0;
        if(isKpiObj) state.kpi[key] = val;
        commit();
      });
    };
    bindNum('kpiYearlyTarget','yearlyTargetSales', true);
    bindNum('kpiQualifiedMultiplier','qualifiedPipelineMultiplier', true);
    bindNum('kpiWinRateMin','targetWinRateMin', true);
    bindNum('kpiWinRateMax','targetWinRateMax', true);
    bindNum('kpiSiteVisitTarget','targetSiteVisitRate', true);
  }
}

/* ---------------------------------------------------------
   SYNC / BACKUP CONTROLS
--------------------------------------------------------- */
// A wholesale state swap (sync pull, backup restore) leaves currentUser
// pointing at an object that is no longer in state.users. Re-bind it by id,
// and sign out if the account vanished or was disabled elsewhere.
function reattachCurrentUser(){
  if(!currentUser) return;
  const match = state.users.find(u => u.id === currentUser.id && u.username === currentUser.username);
  if(match && match.active){ currentUser = match; return; }
  currentUser = null;
  clearSession();
  authMode = 'login';
  authError = 'Your account is no longer available on this data set. Please sign in again.';
  renderAuthScreen();
}

document.getElementById('signOutBtn').addEventListener('click', ()=>{
  if(confirm('Sign out of the portal?')) signOut();
});
document.getElementById('syncNowBtn').addEventListener('click', async ()=>{
  const ok = await loadSharedState();
  if(!ok && !storageAvailable) seedIfEmpty();
  ensureDefaultAdmin();
  reattachCurrentUser();
  auditSnapshot = takeAuditSnapshot();
  render();
});
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `eternalgy-ci-portal-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const loaded = JSON.parse(evt.target.result);
      if(loaded.clients && loaded.leads){
        state = loaded; migrateState();
        ensureDefaultAdmin();
        currentMaterialsClientId = state.clients.length ? state.clients[0].id : null;
        auditSnapshot = takeAuditSnapshot();
        reattachCurrentUser();
        logEvent('System', 'Backup', 'Restored data from a backup file');
        commit();
        alert('Backup restored.');
      } else { alert('This file does not look like a valid Eternalgy C&I Portal backup.'); }
    }catch(err){ alert('Could not read that file.'); }
  };
  reader.readAsText(file);
});

/* ---------------------------------------------------------
   UTIL
--------------------------------------------------------- */
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }

// Resize + compress an uploaded photo (canvas) so drone roof photos don't
// blow past the shared storage size limit. Returns a JPEG data URL.
function readAndCompressImage(file, maxDim=1400, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function seedIfEmpty(){
  if(!state.clients.length && !state.leads.length){ seedData(); }
}

// First run (or a backup restored from before sign-in existed) needs one
// admin to get in with. Forced to change the password immediately.
function ensureDefaultAdmin(){
  if(!Array.isArray(state.users)) state.users = [];
  if(state.users.some(u => u.role === 'admin' && u.active)) return;
  const u = makeUser(DEFAULT_ADMIN.username, DEFAULT_ADMIN.password, DEFAULT_ADMIN.name, 'admin');
  u.mustChangePassword = true;
  state.users.push(u);
}

/* ---------------------------------------------------------
   DESKTOP AUTO-UPDATE
   window.portalUpdates is exposed by the Electron preload script. In a
   plain browser it is undefined and this whole block quietly does nothing.
--------------------------------------------------------- */
(function wireUpdates(){
  const api = window.portalUpdates;
  if(!api || typeof api.onUpdateReady !== 'function') return;
  const bar = document.getElementById('updateBar');
  const text = document.getElementById('updateBarText');
  const restart = document.getElementById('updateRestartBtn');
  const dismiss = document.getElementById('updateDismissBtn');
  api.onUpdateReady(info => {
    const v = info && info.version ? info.version : '';
    text.innerHTML = 'Version <strong>' + escapeHtml(v) + '</strong> is ready to install.';
    bar.hidden = false;
  });
  restart.addEventListener('click', ()=> api.restartToUpdate());
  dismiss.addEventListener('click', ()=>{ bar.hidden = true; });
})();

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
(async function init(){
  const found = await loadSharedState();
  if(!found) seedData();
  const before = state.users.length;
  ensureDefaultAdmin();
  if(!found || state.users.length !== before) saveSharedState();
  setSyncStatus(true);

  currentUser = restoreSession();
  if(currentUser && currentUser.mustChangePassword) authMode = 'changePassword';
  auditSnapshot = takeAuditSnapshot();

  if(currentUser && authMode !== 'changePassword') render();
  else renderAuthScreen();
})();
</script>
