        <p>Monitor every change made in the portal and manage who can sign in. Sign-in gating is an accountability layer, not a security boundary — anyone with browser developer tools can still reach the underlying data.</p>
      </div>
    </div>
    <div class="tabs">
      <button data-admin-tab="log" class="${adminTab==='log'?'active':''}">📋 Edit log</button>
      <button data-admin-tab="users" class="${adminTab==='users'?'active':''}">👥 Users</button>
    </div>
    ${body}
    ${renderUserModal()}`;
}

function renderUserModal(){
  if(!userModalOpen) return '';
  const u = editingUserId ? state.users.find(x => x.id === editingUserId) : null;
  const isEdit = !!u;
  const isSelf = u && currentUser && u.id === currentUser.id;
  const lastAdmin = u && u.role === 'admin' && u.active && activeAdminCount() <= 1;
  const t = showUserPw ? 'text' : 'password';
  const eye = showUserPw ? '🙈' : '👁';

  return `
  <div class="modal-overlay" id="userModalOverlay">
    <div class="modal-box" style="max-width:480px;">
      <div class="modal-head">
        <h2>${isEdit ? 'Edit user' : 'Add user'}</h2>
        <button class="modal-close" id="userModalCloseBtn" title="Close">✕</button>
      </div>
      ${userModalError ? `<div class="auth-error">${escapeHtml(userModalError)}</div>` : ''}
      ${lastAdmin ? `<div class="auth-error" style="background:#FCEBC7;border-color:#EBD199;color:#8A5A00;">This is the last active administrator — their role and status are locked so you can't lock yourself out.</div>` : ''}
      <div class="field"><label>Full name</label>
        <input type="text" id="userName" value="${u ? escapeAttr(u.name) : ''}" placeholder="e.g. staff member's full name"></div>
      <div class="field"><label>Username</label>
        <input type="text" id="userUsername" autocapitalize="none" spellcheck="false" value="${u ? escapeAttr(u.username) : ''}" placeholder="e.g. amirul hakim">
        <p style="font-size:11.5px; color:var(--ink-soft); margin:5px 0 0;">Spaces are allowed. Capitals and extra spaces are ignored when signing in.</p></div>
      <div class="row">
        <div class="field"><label>Role</label>
          <select id="userRole" ${lastAdmin ? 'disabled' : ''}>
            <option value="user" ${u && u.role==='user' ? 'selected' : ''}>User — all modules except IT Admin</option>
            <option value="admin" ${u && u.role==='admin' ? 'selected' : ''}>Admin — everything, including IT Admin</option>
          </select></div>
        <div class="field"><label>Status</label>
          <select id="userActive" ${(lastAdmin || isSelf) ? 'disabled' : ''}>
            <option value="1" ${!u || u.active ? 'selected' : ''}>Active</option>
            <option value="0" ${u && !u.active ? 'selected' : ''}>Disabled</option>
          </select></div>
      </div>
      <div class="field">
        <label>${isEdit ? 'Reset password (leave blank to keep current)' : 'Password'}</label>
        <div class="pw-wrap">
          <input type="${t}" id="userPw" autocomplete="new-password" placeholder="${isEdit ? 'Unchanged' : 'At least ' + PW_MIN_LENGTH + ' characters'}">
          <button type="button" class="pw-toggle" id="userPwToggle" title="${showUserPw ? 'Hide' : 'Show'} password">${eye}</button>
        </div>
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); text-transform:none; letter-spacing:0; font-weight:400;">
        <input type="checkbox" id="userMustChange" style="width:auto;" ${(!isEdit || (u && u.mustChangePassword)) ? 'checked' : ''}>
        Require a password change at next sign-in
      </label>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="userCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="userSaveBtn">${isEdit ? 'Save changes' : 'Create user'}</button>
      </div>
    </div>
  </div>`;
}

function exportLogCsv(){
  const rows = filteredLog();
  const head = ['Timestamp','User','Action','Module','Record','Field','Before','After'];
  const esc = v => {
    const s = String(v == null ? '' : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [head.join(',')].concat(rows.map(e =>
    [e.ts, e.userName, e.action, e.module, e.record, e.field, e.from, e.to].map(esc).join(',')));
  const blob = new Blob([lines.join('\r\n')], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `eternalgy-edit-log-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function attachITAdminHandlers(){
  document.querySelectorAll('[data-admin-tab]').forEach(b => b.addEventListener('click', ()=>{
    adminTab = b.dataset.adminTab;
    logPage = 0;
    render();
  }));

  if(adminTab === 'log'){
    const bind = (id, fn, evt) => {
      const el = document.getElementById(id);
      el && el.addEventListener(evt || 'change', fn);
    };
    bind('logFilterUser',   e => { logFilterUser = e.target.value; logPage = 0; render(); });
    bind('logFilterModule', e => { logFilterModule = e.target.value; logPage = 0; render(); });
    bind('logFilterAction', e => { logFilterAction = e.target.value; logPage = 0; render(); });
    bind('logFilterFrom',   e => { logFilterFrom = e.target.value; logPage = 0; render(); });
    bind('logFilterTo',     e => { logFilterTo = e.target.value; logPage = 0; render(); });

    const search = document.getElementById('logSearch');
    search && search.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); logSearch = e.target.value; logPage = 0; render(); }
    });
    search && search.addEventListener('blur', e => {
      if(e.target.value !== logSearch){ logSearch = e.target.value; logPage = 0; render(); }
    });

    const reset = document.getElementById('logResetBtn');
    reset && reset.addEventListener('click', ()=>{
      logFilterUser = logFilterModule = logFilterAction = logFilterFrom = logFilterTo = logSearch = '';
      logPage = 0; render();
    });

    const prev = document.getElementById('logPrevBtn');
    prev && prev.addEventListener('click', ()=>{ if(logPage > 0){ logPage--; render(); } });
    const next = document.getElementById('logNextBtn');
    next && next.addEventListener('click', ()=>{ logPage++; render(); });
    const exp = document.getElementById('logExportBtn');
    exp && exp.addEventListener('click', exportLogCsv);
  }

  if(adminTab === 'users'){
    const add = document.getElementById('addUserBtn');
    add && add.addEventListener('click', ()=>{
      editingUserId = null; userModalOpen = true; userModalError = ''; showUserPw = false; render();
    });
    document.querySelectorAll('[data-edit-user]').forEach(b => b.addEventListener('click', ()=>{
      editingUserId = parseInt(b.dataset.editUser);
      userModalOpen = true; userModalError = ''; showUserPw = false; render();
    }));
    document.querySelectorAll('[data-delete-user]').forEach(b => b.addEventListener('click', ()=>{
      if(b.disabled) return;
      const id = parseInt(b.dataset.deleteUser);
      const u = state.users.find(x => x.id === id);
      if(!u) return;
      if(u.id === currentUser.id) return;
      if(u.role === 'admin' && u.active && activeAdminCount() <= 1) return;
      if(!confirm(`Delete the account "${u.username}"? Their past entries stay in the edit log.`)) return;
      state.users = state.users.filter(x => x.id !== id);
      commit();
    }));
  }

  if(userModalOpen) attachUserModalHandlers();
}

function attachUserModalHandlers(){
  const close = ()=>{ userModalOpen = false; editingUserId = null; userModalError = ''; showUserPw = false; render(); };
  const overlay = document.getElementById('userModalOverlay');
  overlay && overlay.addEventListener('click', e => { if(e.target === overlay) close(); });
  const closeBtn = document.getElementById('userModalCloseBtn');
  closeBtn && closeBtn.addEventListener('click', close);
  const cancelBtn = document.getElementById('userCancelBtn');
  cancelBtn && cancelBtn.addEventListener('click', close);

  const toggle = document.getElementById('userPwToggle');
  toggle && toggle.addEventListener('click', ()=>{
    const fields = ['userName','userUsername','userPw'].map(id => (document.getElementById(id)||{}).value || '');
    const role = (document.getElementById('userRole')||{}).value;
    const active = (document.getElementById('userActive')||{}).value;
    const must = (document.getElementById('userMustChange')||{}).checked;
    showUserPw = !showUserPw;
    render();
    ['userName','userUsername','userPw'].forEach((id,i)=>{
      const el = document.getElementById(id); if(el) el.value = fields[i];
    });
    const r = document.getElementById('userRole'); if(r && role !== undefined) r.value = role;
    const a = document.getElementById('userActive'); if(a && active !== undefined) a.value = active;
    const m = document.getElementById('userMustChange'); if(m) m.checked = must;
    const pw = document.getElementById('userPw'); if(pw) pw.focus();
  });

  const save = document.getElementById('userSaveBtn');
  save && save.addEventListener('click', ()=>{
    const name = document.getElementById('userName').value.trim();
    const username = normalizeUsername(document.getElementById('userUsername').value);
    const roleEl = document.getElementById('userRole');
    const activeEl = document.getElementById('userActive');
    const password = document.getElementById('userPw').value;
    const mustChange = document.getElementById('userMustChange').checked;
    const existing = editingUserId ? state.users.find(x => x.id === editingUserId) : null;

    const fail = msg => { userModalError = msg; render(); };
    if(!username) return fail('Username is required.');
    if(!/^[a-z0-9._ -]+$/.test(username)) return fail('Username can only use letters, numbers, spaces, dot, dash and underscore.');
    const clash = state.users.find(x => normalizeUsername(x.username) === username && x.id !== editingUserId);
    if(clash) return fail('That username is already taken.');
    if(!existing && password.length < PW_MIN_LENGTH) return fail(`Password must be at least ${PW_MIN_LENGTH} characters.`);
    if(existing && password && password.length < PW_MIN_LENGTH) return fail(`Password must be at least ${PW_MIN_LENGTH} characters.`);

    // Guard: never let the last active admin be demoted or disabled.
    const nextRole = roleEl.disabled ? (existing ? existing.role : 'user') : roleEl.value;
    const nextActive = activeEl.disabled ? (existing ? existing.active : true) : activeEl.value === '1';
    if(existing && existing.role === 'admin' && existing.active && (nextRole !== 'admin' || !nextActive) && activeAdminCount() <= 1){
      return fail('This is the last active administrator — promote someone else first.');
    }

    if(existing){
      existing.name = name || existing.username;
      existing.username = username;
      existing.role = nextRole;
      existing.active = nextActive;
      existing.mustChangePassword = mustChange;
      if(password){
        setPassword(existing, password);
        logEvent('IT Admin', existing.username, 'Password reset by ' + currentUser.name);
      }
    } else {
      const u = makeUser(username, password, name, roleEl.value);
      u.mustChangePassword = mustChange;
      state.users.push(u);
    }
    userModalOpen = false; editingUserId = null; userModalError = ''; showUserPw = false;
    commit();
  });
}

/* ---------------------------------------------------------
   RENDER ROUTER
--------------------------------------------------------- */
function render(){
  // No signed-in user (or a forced password change pending) — the sign-in
  // screen takes over the whole window instead of the app shell.
  if(!currentUser || authMode === 'changePassword'){ renderAuthScreen(); return; }
  const app = document.querySelector('.app');
  if(app) app.style.display = '';
  const authRoot = document.getElementById('authRoot');
  if(authRoot) authRoot.innerHTML = '';
  refreshUserChrome();
  if(currentPage === 'itadmin' && !isAdmin()) currentPage = 'pipeline';

  document.querySelectorAll('#nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.page === currentPage);
  });
  const main = document.getElementById('main');
  let html = '';
  if(currentPage === 'projects') html = renderProjects();
  if(currentPage === 'stageSettings') html = renderStageSettings();
  if(currentPage === 'materials') html = renderMaterials();
  if(currentPage === 'pipeline') html = renderPipeline();
  if(currentPage === 'design') html = renderDesign();
  if(currentPage === 'savings') html = renderSavings();
  if(currentPage === 'gitaCalc') html = renderGitaCalc();
  if(currentPage === 'gita') html = renderGita();
  if(currentPage === 'installReports') html = renderInstallReports();
  if(currentPage === 'kpi') html = renderKPI();
  if(currentPage === 'guidelines') html = renderGuidelines();
  if(currentPage === 'weeklyReports') html = renderWeeklyReports();
  if(currentPage === 'itadmin') html = renderITAdmin();
  main.innerHTML = html;
  attachPageHandlers();
}

document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-page]');
  if(!btn) return;
  currentPage = btn.dataset.page;
  render();
});

/* ---------------------------------------------------------
   THEME (light / dark mode toggle)
--------------------------------------------------------- */
function getThemeMode(){
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}
function syncThemeButtons(){
  const mode = getThemeMode();
  const lightBtn = document.getElementById('themeLightBtn');
  const darkBtn = document.getElementById('themeDarkBtn');
  if(lightBtn) lightBtn.classList.toggle('active', mode === 'light');
  if(darkBtn) darkBtn.classList.toggle('active', mode === 'dark');
}
function setThemeMode(mode){
  if(mode === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  else{ document.documentElement.removeAttribute('data-theme'); }
  try{ window.localStorage.setItem('eternalgy_theme_mode', mode); }catch(e){}
  syncThemeButtons();
  render(); // re-render current page so inline SVG charts pick up new theme colors
}
document.getElementById('themeToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-theme-choice]');
  if(!btn) return;
  setThemeMode(btn.dataset.themeChoice);
});
syncThemeButtons();

/* ---------------------------------------------------------
   PHOTO LIGHTBOX (in-page viewer — works everywhere, no popups)
   Any <img data-view-photo="..."> anywhere in the app (current page,
   or inside a modal) opens here. Delegated on document so it keeps
   working after re-renders without needing to be re-wired per page.
--------------------------------------------------------- */
let lightboxUrl = null;
let lightboxAlt = '';
function renderLightbox(){
  const root = document.getElementById('lightboxRoot');
  root.innerHTML = lightboxUrl ? `
    <div class="lightbox-overlay" id="lightboxOverlay">
      <button type="button" class="lightbox-close" id="lightboxCloseBtn" title="Close">✕</button>
      <img src="${lightboxUrl}" alt="${escapeAttr(lightboxAlt)}">
    </div>` : '';
}
document.addEventListener('click', e=>{
  const img = e.target.closest('img[data-view-photo]');
  if(img){
    lightboxUrl = img.getAttribute('data-view-photo');
    lightboxAlt = img.alt || 'Photo';
    renderLightbox();
    return;
  }
  if(e.target.closest('#lightboxCloseBtn') || e.target.id === 'lightboxOverlay'){
    lightboxUrl = null;
    renderLightbox();
  }
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && lightboxUrl){ lightboxUrl = null; renderLightbox(); }
});

// Formal document-control strip shown under the letterhead of every report:
// a traceable document number, the exact generation timestamp, and a
// classification tag — the kind of metadata a technical/compliance
// document is expected to carry.
function docControlNo(prefix, refId){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `ETG-${prefix}-${y}${m}${day}${refId!==undefined && refId!==null ? '-'+refId : ''}`;
}
function docControlBlockHtml(docNo, classification){
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const timeStr = now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  return `<div class="doc-control">
    <span>DOCUMENT NO. <b>${escapeHtml(docNo)}</b></span>
    <span>GENERATED <b>${dateStr}, ${timeStr}</b></span>
    <span class="doc-classification">${escapeHtml(classification || 'Internal Use')}</span>
  </div>`;
}
// Prepared / Checked / Approved sign-off block, appended to the bottom of
// every report so it can be routed for physical or scanned sign-off —
// standard practice for site and compliance documentation.
function signOffBlockHtml(){
  const cols = ['Prepared By','Checked By','Approved By'];
  return `<div class="doc-signoff">
    ${cols.map(c=>`<div class="signoff-col">
      <label>${c}</label>
      <div class="signoff-line"></div>
      <div class="signoff-sub">Name &amp; Date</div>
    </div>`).join('')}
  </div>
  <p class="doc-footer-note">This document was generated by the Eternalgy C&amp;I Portal and is intended for internal / customer reference. ETERNALGY SDN. BHD. (1523087-A)</p>`;
}

let pdfExportData = null; // {title, bodyHtml}

// Print helper that opens a fresh top-level tab and prints from there.
// Some environments this portal is embedded in (e.g. an app preview
// running inside a sandboxed frame) block window.print() when called
// from inside that frame — the button appears to do nothing. Printing
// from a real, separate tab avoids that and is what actually lets
// "Save as PDF" work reliably in the browser's print dialog.
function printDocument(title, bodyHtml){
  const win = window.open('', '_blank');
  if(!win){
    // Pop-up blocked — fall back to printing in place, which still
    // works in a normal (non-sandboxed) browser tab.
    window.print();
    return;
  }
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(title)}</title>
  <style>
    :root{ --navy:#0F3D38; --ink:#152722; --ink-soft:#5E7069; --amber-deep:#C97D1A; --line:#DCE6DE; }
    *{box-sizing:border-box;}
    body{ font-family:'IBM Plex Sans', Arial, sans-serif; color:var(--ink); margin:0; padding:28px; counter-reset:section-counter; }
    h1{ font-family:'Space Grotesk', Arial, sans-serif; font-size:20px; margin:0 0 2px; color:var(--navy); }
    h3{ font-family:'Space Grotesk', Arial, sans-serif; }
    .report-doc-sub{ color:var(--ink-soft); font-size:12.5px; margin:0 0 14px; }
    .doc-control{ display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; background:#F4F6F5; border:1px solid var(--line); border-radius:5px; padding:8px 14px; margin:0 0 18px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }
    .doc-control b{ color:var(--navy); font-weight:600; }
    .doc-control .doc-classification{ margin-left:auto; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:#8A5A00; background:#FCEBC7; padding:2px 8px; border-radius:3px; }

      }
    }
  </style></head><body>
    ${bodyHtml}
  </body></html>`);
  win.document.close();
  win.focus();

  setTimeout(()=>{ try{ win.print(); }catch(err){ /* user can still print manually from the tab */ } }, 350);
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function openPdfExport(page, param){
  pdfExportData = buildPdfExportContent(page || currentPage, param);
  renderPdfExport();
}

function renderPdfExport(){
  const root = document.getElementById('pdfExportRoot');
  if(!pdfExportData){ root.innerHTML = ''; return; }
  // custom:true (currently only the GITA Calculator report) supplies its own
  // complete, self-styled layout and skips the shared letterhead/doc-control/
  // sign-off chrome that every other module's report uses.
  const printArea = pdfExportData.custom ? pdfExportData.bodyHtml : `
    <div class="report-doc">
      ${letterheadHtml()}
      <div class="letterhead-rule"></div>
      ${docControlBlockHtml(pdfExportData.docNo)}
      <h1>${escapeHtml(pdfExportData.title)}</h1>
      ${pdfExportData.bodyHtml}
      ${signOffBlockHtml()}
    </div>`;
  root.innerHTML = `
    <div class="modal-overlay" id="pdfExportOverlay">
      <div class="modal-box" style="max-width:840px;">
        <div class="modal-head no-print">
          <h2>${escapeHtml(pdfExportData.title)}</h2>
          <button type="button" class="modal-close" id="pdfExportCloseBtn">✕</button>
        </div>
        <div id="printArea">
          ${printArea}
        </div>
        <div class="modal-actions no-print">
          <button type="button" class="btn btn-ghost" id="pdfExportCloseBtn2">Close</button>
          <button type="button" class="btn btn-amber" id="pdfExportPrintBtn">⬇ Export as PDF</button>
        </div>
      </div>
    </div>`;
}

function buildPdfExportContent(page, param){
  const rm = n => 'RM ' + Math.round(n||0).toLocaleString();
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const resultsHtml = id => { const el = document.getElementById(id); return (el && el.innerHTML.trim()) ? el.innerHTML : '<p style="color:var(--ink-soft); font-size:13px;">No calculation run yet — go back, fill in the numbers and click Calculate before exporting.</p>'; };

  if(page === 'materialsSite'){
    const client = state.clients.find(c => c.id === param);
    if(!client) return { title: 'Material List', bodyHtml: '<p>Client not found.</p>' };
    const rows = (client.materials||[]).map(m => {
      const lineTotal = (m.qty||0) * (m.price||0);
      return `<tr><td>${escapeHtml(m.name||'—')}</td><td>${escapeHtml(m.supplier||'—')}</td>
        <td>${m.qty||0} ${escapeHtml(m.unit||'')}</td><td>${rm(m.price)}</td><td>${rm(lineTotal)}</td></tr>`;
    }).join('') || `<tr><td colspan="5" style="text-align:center; color:var(--ink-soft);">No materials listed yet.</td></tr>`;
    const grandTotal = (client.materials||[]).reduce((sum,m)=> sum + (m.qty||0)*(m.price||0), 0);
    const quotedPrice = client.quotedPrice || 0;
    const profit = quotedPrice - grandTotal;
    const marginPct = quotedPrice > 0 ? (profit / quotedPrice * 100) : null;
    return { title: `Material List — ${client.name}`, docNo: docControlNo('MATL', client.id), bodyHtml: `
      <div class="report-doc-grid">
        <div class="report-doc-field"><label>Site / Client</label><div>${escapeHtml(client.name)}</div></div>

        <div class="report-doc-field"><label>System size</label><div>${client.systemSize ? client.systemSize+' kWp' : '—'}</div></div>
        <div class="report-doc-field"><label>Quoted price</label><div>${quotedPrice ? rm(quotedPrice) : '—'}</div></div>
      </div>
      <table><thead><tr><th>Material</th><th>Supplier</th><th>Qty</th><th>Unit price</th><th>Line total</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="report-doc-stats" style="margin-top:16px;">
        <div class="stat"><div class="v">${rm(grandTotal)}</div><div class="l">Material Cost</div></div>
        <div class="stat"><div class="v">${quotedPrice ? rm(profit) : '—'}</div><div class="l">Gross Profit</div></div>

document.addEventListener('click', e=>{
  const siteBtn = e.target.closest('[data-pdf-export-site-btn]');
  if(siteBtn){ openPdfExport('materialsSite', parseInt(siteBtn.dataset.pdfExportSiteBtn)); return; }
  const pdfBtn = e.target.closest('[data-pdf-export-btn]');
  if(pdfBtn){ openPdfExport(pdfBtn.dataset.pdfExportPage || undefined); return; }
  if(e.target.closest('#pdfExportPrintBtn')){
    const printHtml = pdfExportData.custom
      ? pdfExportData.bodyHtml
      : `${letterheadHtml()}<div class="letterhead-rule"></div><div class="report-doc">${docControlBlockHtml(pdfExportData.docNo)}<h1>${escapeHtml(pdfExportData.title)}</h1>${pdfExportData.bodyHtml}${signOffBlockHtml()}</div>`;
    printDocument(pdfExportData.title, printHtml);
    return;
  }
  if(e.target.closest('#pdfExportCloseBtn') || e.target.closest('#pdfExportCloseBtn2') || e.target.id === 'pdfExportOverlay'){
    pdfExportData = null;
    renderPdfExport();
  }
});

/* ---------------------------------------------------------
   PAGE — PROJECT MANAGEMENT
--------------------------------------------------------- */
function stageProgress(client){
  const defs = state.stageDefs;
  const done = defs.filter(s => client.stages[s.key]).length;
  return { done, total: defs.length, pct: defs.length ? Math.round((done/defs.length)*100) : 0 };
}

function ringSVG(pct){
  const r = 24, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  const color = pct >= 100 ? 'var(--green)' : 'var(--amber)';
  return `<svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="6"/>
    <circle cx="28" cy="28" r="${r}" fill="none" style="stroke:${color}" stroke-width="6"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
      transform="rotate(-90 28 28)"/>
  </svg>`;
}

function renderProjects(){
  const defs = state.stageDefs;
  const q = searchQuery.trim().toLowerCase();
  const filteredClients = !q ? state.clients : state.clients.filter(c =>
    (c.name||'').toLowerCase().includes(q) || (c.address||'').toLowerCase().includes(q)
  );
  const cards = filteredClients.map(client => {
    const prog = stageProgress(client);
    const stageHtml = defs.map((s, i) => {
      const isFinal = i === defs.length-1;
      const done = client.stages[s.key];
      const remark = client.stageRemarks[s.key] || '';
      const remarkOpenKey = `${client.id}:${s.key}`;
      const isOpen = openRemarks.has(remarkOpenKey) || remark.length>0;
      return `
      <div class="stage-item ${done?'done':''} ${isFinal?'final':''}">
        ${isFinal ? `<div class="final-badge">Final stage</div>` : ''}
        <div class="stage-row" data-toggle-check data-client="${client.id}" data-stage="${s.key}">
          <input type="checkbox" tabindex="-1" ${done?'checked':''}>
          <span class="stage-idx">${String(i+1).padStart(2,'0')}</span>
          <span class="stage-text">${escapeHtml(s.label)}</span>
          <button type="button" class="stage-note-btn ${remark?'has-note':''}" data-toggle-remark="${remarkOpenKey}" title="Remark">📝${remark?'<span class="dot"></span>':''}</button>

          <textarea placeholder="Remark — note down anything unusual for this stage…" data-remark-client="${client.id}" data-remark-stage="${s.key}">${escapeHtml(remark)}</textarea>

          <p class="client-meta">${prog.done} of ${prog.total} stages complete</p>
          ${(client.address || client.agent || client.systemSize || client.quotedPrice) ? `<p class="client-sub-meta">
            ${client.address ? `<span>📍 ${escapeHtml(client.address)}</span>` : ''}
            ${client.agent ? `<span>👤 ${escapeHtml(client.agent)}</span>` : ''}
            ${client.systemSize ? `<span>⚡ ${client.systemSize} kWp</span>` : ''}
            ${client.quotedPrice ? `<span>💰 RM ${client.quotedPrice.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</span>` : ''}

        </div>
        <div class="ring-wrap">
          <div class="ring">${ringSVG(prog.pct)}<span>${prog.pct}%</span></div>
          <div class="ring-label">Overall<br><b>${prog.pct}%</b> complete</div>
        </div>
      </div>
      <div class="stage-grid">${stageHtml}</div>
      <div class="roof-photos">

          <label class="btn-upload">📤 Upload photo

        </div>
        <div class="roof-photo-grid">
          ${(client.roofPhotos && client.roofPhotos.length) ? client.roofPhotos.map(p=>`
            <div class="roof-photo">
              <img src="${p.dataUrl}" alt="${escapeAttr(p.name||'roof photo')}" data-view-photo="${p.dataUrl}">
              <button type="button" class="roof-photo-remove" data-remove-photo="${client.id}:${p.id}" title="Remove">✕</button>

      </div>
      <div style="margin-top:14px;">
        <button class="btn-danger" data-remove-client="${client.id}">Remove client</button>
      </div>
    </div>`;

  return `
    <div class="page-head">
      <div>
        <p class="eyebrow">Module 02</p>
        <h2>Project Management</h2>
        <p>Track each client from intake through commissioning. Tick a stage as it's completed, add a remark if something needs attention — the ring shows overall progress at a glance.</p>
      </div>
      <button class="btn btn-ghost" data-page="stageSettings" id="gotoSettingsBtn">⚙ Customize stages</button>
      <button class="btn btn-ghost" type="button" data-pdf-export-btn>⬇ Export as PDF</button>
    </div>
    <div class="panel" style="margin-bottom:18px;">
      <div class="client-search-row">
        <input type="search" id="clientSearchInput" placeholder="🔍 Search by site / client name or address…" value="${escapeAttr(searchQuery)}">
        <button class="btn btn-ghost" type="button" id="clientSearchBtn">Search</button>
        ${searchQuery ? `<button class="btn btn-ghost" type="button" id="clientSearchClearBtn">✕ Clear</button>` : ''}
      </div>
      <div class="client-toolbar" style="margin-top:12px;">

/* ---------------------------------------------------------
   PAGE — MATERIAL LIST
--------------------------------------------------------- */
function renderMaterials(){
  const q = matSearchQuery.trim().toLowerCase();
  const searchClients = !q ? state.clients : state.clients.filter(c =>
    (c.name||'').toLowerCase().includes(q) || (c.address||'').toLowerCase().includes(q)
  );
  if(!currentMaterialsClientId && state.clients.length) currentMaterialsClientId = state.clients[0].id;
  if(q && searchClients.length && !searchClients.some(c=>c.id===currentMaterialsClientId)){
    currentMaterialsClientId = searchClients[0].id;
  }
  const client = state.clients.find(c => c.id === currentMaterialsClientId);
  const multiMatchNote = (q && searchClients.length > 1)
    ? `<p style="font-size:12px; color:var(--ink-soft); margin:10px 0 0;">${searchClients.length} sites match "${escapeHtml(matSearchQuery)}" — showing <strong>${escapeHtml(client ? client.name : '')}</strong>. Narrow your search for a different one.</p>`
    : '';

  let body = '';
  if(!state.clients.length){
    body = `<div class="empty">Add a client in Project Management first, then come back to list materials for them.</div>`;
  } else if(q && !searchClients.length){
    body = `<div class="empty">No clients match "${escapeHtml(matSearchQuery)}".</div>`;
  } else if(client){
    const rows = client.materials.map(m => {
      const lineTotal = (m.qty||0) * (m.price||0);
      return `<tr data-mat="${m.id}">
        <td><input type="text" value="${escapeAttr(m.name)}" data-field="name"></td>
        <td><input type="text" value="${escapeAttr(m.supplier||'')}" data-field="supplier" placeholder="Supplier"></td>
        <td><input type="number" min="0" step="1" value="${m.qty}" data-field="qty" style="width:80px;"></td>
        <td><input type="text" value="${escapeAttr(m.unit||'')}" data-field="unit" style="width:80px;" placeholder="pcs"></td>
        <td class="mono"><input type="number" min="0" step="0.01" value="${m.price}" data-field="price" style="width:110px;"></td>
        <td class="mono">RM ${lineTotal.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</td>
        <td><button class="btn-danger" data-remove-mat="${m.id}">Remove</button></td>
      </tr>`;
    }).join('');
    const grandTotal = client.materials.reduce((sum,m)=> sum + (m.qty||0)*(m.price||0), 0);

    const quotedPrice = client.quotedPrice || 0;
    const profit = quotedPrice - grandTotal;
    const marginPct = quotedPrice > 0 ? (profit / quotedPrice * 100) : null;
    const pricePerKwp = client.systemSize > 0 ? (grandTotal / client.systemSize) : null;
    const fmt = n => `RM ${n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}`;

    const missing = [];
    if(!quotedPrice) missing.push('a quoted price');
    if(!client.systemSize) missing.push('system size (kWp)');

    body = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap;">
        <p style="font-size:13px; color:var(--ink-soft); margin:0;">Editing materials for <strong style="color:var(--navy);">${escapeHtml(client.name)}</strong></p>
        <button class="btn btn-ghost" type="button" data-pdf-export-site-btn="${client.id}">⬇ Export as PDF</button>
      </div>
      <div class="panel">
        <table>
          <thead><tr><th>Material</th><th>Supplier</th><th>Qty</th><th>Unit</th><th>Unit price (RM)</th><th>Line total</th><th></th></tr></thead>
          <tbody>
            ${rows || `<tr><td colspan="7" style="color:var(--ink-soft); text-align:center; padding:20px;">No materials listed for this client yet.</td></tr>`}
            <tr class="mat-total-row"><td colspan="5">Grand total</td><td class="mono">${fmt(grandTotal)}</td><td></td></tr>
          </tbody>
        </table>
        <form id="addMatForm" class="row" style="margin-top:16px; align-items:flex-end;">
          <div class="field"><label>Material name</label><input type="text" id="matName" placeholder="e.g. Mounting rail 4.2m" required></div>
          <div class="field"><label>Supplier</label><input type="text" id="matSupplier" placeholder="e.g. ABC Solar Supplies"></div>
          <div class="field" style="max-width:90px;"><label>Qty</label><input type="number" id="matQty" min="0" step="1" value="1" required></div>
          <div class="field" style="max-width:90px;"><label>Unit</label><input type="text" id="matUnit" placeholder="pcs"></div>
          <div class="field" style="max-width:130px;"><label>Unit price (RM)</label><input type="number" id="matPrice" min="0" step="0.01" value="0" required></div>
          <div class="field" style="flex:0;"><button class="btn btn-amber" type="submit">+ Add item</button></div>
        </form>
      </div>
      <div class="panel" style="margin-top:16px;">
        <h3 style="margin:0 0 4px; font-size:15px; color:var(--navy);">Profit Margin Analysis</h3>
        <p style="margin:0 0 4px; font-size:12.5px; color:var(--ink-soft);">Based on this client's quoted price and system size from Module 02.</p>
        ${missing.length ? `<div class="notice" style="margin-top:12px;">Tip: set ${missing.join(' and ')} for this client in <strong>Module 02 → Project Management</strong> to see the full analysis.</div>` : ''}
        <div class="result-strip">
          <div class="result-tile"><div class="val">${quotedPrice ? fmt(quotedPrice) : '—'}</div><div class="lbl">Quoted price</div></div>
          <div class="result-tile"><div class="val">${fmt(grandTotal)}</div><div class="lbl">Material cost</div></div>
          <div class="result-tile"><div class="val" style="${quotedPrice ? `color:${profit<0?'var(--red)':'var(--amber)'};` : ''}">${quotedPrice ? fmt(profit) : '—'}</div><div class="lbl">Gross profit</div></div>
          <div class="result-tile"><div class="val" style="${marginPct!==null ? `color:${marginPct<0?'var(--red)':'var(--amber)'};` : ''}">${marginPct!==null ? marginPct.toFixed(1)+'%' : '—'}</div><div class="lbl">Profit margin</div></div>
          <div class="result-tile"><div class="val">${pricePerKwp!==null ? fmt(pricePerKwp) : '—'}</div><div class="lbl">Material cost / kWp</div></div>
        </div>
      </div>`;
  }

  return `
    <div class="page-head">
      <div>
        <p class="eyebrow">Module 03</p>
        <h2>Material List</h2>
        <p>Quantity, supplier and pricing of materials required for each client's installation, with profit margin at a glance.</p>
      </div>
      <button class="btn btn-ghost" type="button" data-pdf-export-btn>⬇ Export as PDF</button>
    </div>
    <div class="panel" style="margin-bottom:18px;">
      <div class="client-search-row">
        <input type="search" id="matSearchInput" placeholder="🔍 Search by site / client name or address…" value="${escapeAttr(matSearchQuery)}">
        <button class="btn btn-ghost" type="button" id="matSearchBtn">Search</button>
        ${matSearchQuery ? `<button class="btn btn-ghost" type="button" id="matSearchClearBtn">✕ Clear</button>` : ''}
      </div>
      ${multiMatchNote}
    </div>
    ${body}
  `;
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
const PIPE_STAGES = ['New Lead','Site Survey','Proposal Sent','Negotiation','Closed Won'];
const SCHEME_OPTIONS = ['ATAP','CRESS','SELCO','Direct Purchase','PPA / RPVI','Other'];

function pipelineDashboardStats(){
  const leads = state.leads;
  const closedWon = leads.filter(l=>l.stage==='Closed Won');
  const open = leads.filter(l=>l.stage!=='Closed Won');
  const pastProposal = leads.filter(l=>['Proposal Sent','Negotiation','Closed Won'].includes(l.stage));

  const totalDeals = leads.length;
  const pipelineValue = open.reduce((sum,l)=>sum+(l.projectAmount||0),0);
  const closedSales = closedWon.reduce((sum,l)=>sum+(l.projectAmount||0),0);
  const winRate = pastProposal.length ? (closedWon.length/pastProposal.length)*100 : 0;
  const weightedForecast = open.reduce((sum,l)=>sum+((l.projectAmount||0)*((l.probability||0)/100)),0);
  const kwLeads = leads.filter(l=>l.kw>0);
  const totalKw = kwLeads.reduce((sum,l)=>sum+(l.kw||0),0);
  const totalRmForKw = kwLeads.reduce((sum,l)=>sum+(l.projectAmount||0),0);
  const avgRmPerKw = totalKw>0 ? totalRmForKw/totalKw : 0;
  const rm = n => 'RM ' + Math.round(n||0).toLocaleString();

  return `
    <div class="kpi-grid">
      <div class="kpi-tile"><p class="kpi-label">Total Deals</p><div class="kpi-value">${totalDeals}</div></div>
      <div class="kpi-tile"><p class="kpi-label">Pipeline Value</p><div class="kpi-value">${rm(pipelineValue)}</div><p class="kpi-target">${open.length} open deal(s)</p></div>
      <div class="kpi-tile"><p class="kpi-label">Closed Sales</p><div class="kpi-value">${rm(closedSales)}</div><p class="kpi-target">${closedWon.length} closed won</p></div>
      <div class="kpi-tile"><p class="kpi-label">Win Rate</p><div class="kpi-value">${winRate.toFixed(1)}%</div></div>
      <div class="kpi-tile"><p class="kpi-label">Weighted Forecast</p><div class="kpi-value">${rm(weightedForecast)}</div></div>
      <div class="kpi-tile"><p class="kpi-label">Avg RM/kWp</p><div class="kpi-value">${rm(avgRmPerKw)}</div></div>
    </div>`;
}

function renderPipeline(){
  const q = pipelineSearchQuery.trim().toLowerCase();
  const filteredLeads = !q ? state.leads : state.leads.filter(l =>
    (l.name||'').toLowerCase().includes(q) || (l.address||'').toLowerCase().includes(q) || (l.contactPerson||'').toLowerCase().includes(q)
  );
  const cols = PIPE_STAGES.map(stage => {
    const leads = filteredLeads.filter(l => l.stage === stage);
    const cards = leads.map(l => `
      <div class="pipeline-card">
        <span class="lead-name">${escapeHtml(l.name)}</span>
        <span class="kw">${l.kw||0} kWp${l.projectAmount ? ` · RM ${l.projectAmount.toLocaleString()}` : ''}</span>
        ${l.agent ? `<div class="pipeline-card-meta">👤 ${escapeHtml(l.agent)}</div>` : ''}
        ${l.probability ? `<div class="pipeline-card-meta">🎯 ${l.probability}% probability</div>` : ''}
        ${l.convertedClientId && state.clients.some(c=>c.id===l.convertedClientId) ? `<span class="pipeline-card-badge">✅ In Project Management</span>` : ''}
        <select data-lead="${l.id}">${PIPE_STAGES.map(s=>`<option value="${s}" ${s===l.stage?'selected':''}>${s}</option>`).join('')}</select>

      </div>`).join('');
    return `<div class="pipeline-col"><h3>${stage} · ${leads.length}</h3>${cards}</div>`;

  return `
    <div class="page-head">
      <div>
        <p class="eyebrow">Module 01</p><h2>Sales Pipeline</h2>
        <p>Move each deal across stages as it progresses. Click a card to see and edit full details, or use the dropdown for a quick stage change.</p>

    ${pipelineDashboardStats()}

      <div class="pipeline-toolbar">
        <div class="client-search-row">
          <input type="search" id="pipelineSearchInput" placeholder="🔍 Search by site / client name…" value="${escapeAttr(pipelineSearchQuery)}">
          <button class="btn btn-ghost" type="button" id="pipelineSearchBtn">Search</button>
          ${pipelineSearchQuery ? `<button class="btn btn-ghost" type="button" id="pipelineSearchClearBtn">✕ Clear</button>` : ''}
        </div>
        <button class="btn btn-amber" type="button" id="newDealBtn">+ New Deal</button>
      </div>
    </div>
    <div class="pipeline-board" style="margin-top:16px;">${cols}</div>
    ${dealModalOpen ? renderDealModal() : ''}
    ${dealReportViewId ? renderDealReportView() : ''}
  `;

function calcDesign(){
  const consumption = parseFloat(document.getElementById('dsConsumption').value) || 0;
  const psh = parseFloat(document.getElementById('dsPSH').value) || 1;
  const panelW = parseFloat(document.getElementById('dsPanelW').value) || 1;
  const workDays = parseFloat(document.getElementById('dsWorkDays').value) || 30;
  const maxDemand = parseFloat(document.getElementById('dsMaxDemand').value) || 0;
  const solarUsagePct = parseFloat(document.getElementById('dsSolarUsage').value) || 0;
  const roofArea = parseFloat(document.getElementById('dsRoofArea').value) || 0;
  const tariffRate = parseFloat(document.getElementById('dsTariffRate').value) || 0;
  const projectCost = parseFloat(document.getElementById('dsProjectCost').value) || 0;

  const dailyConsumption = consumption / workDays;
  const AREA_DENSITY = 6.34; // m2 per kWp, per Input & Sizing sheet

  const sizeByDemand = maxDemand * 1.35;
  const sizeByUsage = dailyConsumption / psh;
  const sizeByArea = roofArea > 0 ? (roofArea / AREA_DENSITY) : null;

  // Pre-fill "Propose capacity" the first time only, so re-calculating after a manual edit doesn't overwrite it
  const proposeEl = document.getElementById('dsProposeCapacity');
  if(proposeEl && !proposeEl.dataset.touched){
    proposeEl.value = sizeByDemand.toFixed(2);
  }
  const proposeCapacity = parseFloat((proposeEl && proposeEl.value) || sizeByDemand) || 0;

  const panelCount = panelW > 0 ? Math.ceil((proposeCapacity*1000) / panelW) : 0;
  const dailyMAQ = proposeCapacity / 1.4 * 4.32;
  const monthlyMAQ = dailyMAQ * workDays;
  const monthlyGeneration = proposeCapacity * psh * workDays;
  const excessKwh = monthlyGeneration - monthlyMAQ;
  const excessPct = monthlyGeneration > 0 ? (excessKwh / monthlyGeneration * 100) : 0;
  const priceKwp = (proposeCapacity > 0 && projectCost > 0) ? (projectCost / proposeCapacity) : null;

  document.getElementById('dsResults').innerHTML = `
    <h4 style="margin:20px 0 8px; font-size:14px; color:var(--navy);">Sizing suggestions</h4>
    <div class="result-strip">
      <div class="result-tile"><div class="val">${sizeByDemand.toFixed(2)} kWp</div><div class="lbl">Based on max demand (×1.35)</div></div>
      <div class="result-tile"><div class="val">${sizeByUsage.toFixed(2)} kWp</div><div class="lbl">Based on usage</div></div>
      <div class="result-tile"><div class="val">${sizeByArea!==null ? sizeByArea.toFixed(2)+' kWp' : '—'}</div><div class="lbl">Based on roof area</div></div>
    </div>
    <div class="field" style="max-width:260px; margin-top:14px;">
      <label>Propose capacity (kWp) — adjust as needed</label>
      <input type="number" id="dsProposeCapacity" min="0" step="0.01" value="${proposeCapacity.toFixed(2)}" data-touched="1">
    </div>
    <button class="btn btn-primary no-print" id="dsRecalcBtn" style="margin-top:10px;">Recalculate from this capacity</button>
    <h4 style="margin:20px 0 8px; font-size:14px; color:var(--navy);">Result at ${proposeCapacity.toFixed(2)} kWp</h4>
    <div class="result-strip">
      <div class="result-tile"><div class="val">${panelCount}</div><div class="lbl">Panels required</div></div>
      <div class="result-tile"><div class="val">${Math.round(monthlyMAQ).toLocaleString()} kWh</div><div class="lbl">Estimate monthly MAQ</div></div>
      <div class="result-tile"><div class="val">${Math.round(monthlyGeneration).toLocaleString()} kWh</div><div class="lbl">Estimate monthly generation</div></div>
      <div class="result-tile"><div class="val" style="${excessKwh<0?'color:var(--amber);':''}">${Math.round(excessKwh).toLocaleString()} kWh</div><div class="lbl">Excess to TNB (${excessPct.toFixed(1)}%)</div></div>
      ${priceKwp!==null ? `<div class="result-tile"><div class="val">RM ${Math.round(priceKwp).toLocaleString()}</div><div class="lbl">Price / kWp</div></div>` : ''}
    </div>
  `;
  const recalcBtn = document.getElementById('dsRecalcBtn');
  if(recalcBtn) recalcBtn.addEventListener('click', calcDesign);
}
// Calculation ② — go the other direction: user already knows the system
// size (kWp), so work out estimated monthly generation and RM savings
// directly, without needing a TNB bill's consumption/demand figures.
function calcDesignFromSize(){
  const sizeKwp = parseFloat(document.getElementById('dsSizeKnown').value) || 0;
  const panelW = parseFloat(document.getElementById('dsSizeKnownPanelW').value) || 1;
  const workDays = parseFloat(document.getElementById('dsSizeKnownWorkDays').value) || 30;
  const solarUsagePct = parseFloat(document.getElementById('dsSizeKnownSolarUsage').value) || 0;
  const psh = parseFloat(document.getElementById('dsPSH').value) || 1;
  const tariffRate = parseFloat(document.getElementById('dsTariffRate').value) || 0;

  const panelCount = panelW > 0 ? Math.ceil((sizeKwp*1000) / panelW) : 0;
  const monthlyGeneration = sizeKwp * psh * workDays;
  const usedGeneration = monthlyGeneration * (solarUsagePct/100);
  const monthlySavings = usedGeneration * tariffRate;
  const annualSavings = monthlySavings * 12;
  const dailyMAQ = sizeKwp / 1.4 * 4.32;
  const monthlyMAQ = dailyMAQ * workDays;
  const excessKwh = monthlyGeneration - monthlyMAQ;

  document.getElementById('dsSizeKnownResults').innerHTML = `
    <h4 style="margin:20px 0 8px; font-size:14px; color:var(--navy);">Result at ${sizeKwp.toFixed(2)} kWp</h4>
    <div class="result-strip">
      <div class="result-tile"><div class="val">${panelCount}</div><div class="lbl">Panels required</div></div>
      <div class="result-tile"><div class="val">${Math.round(monthlyGeneration).toLocaleString()} kWh</div><div class="lbl">Estimate monthly generation</div></div>
      <div class="result-tile"><div class="val">${Math.round(usedGeneration).toLocaleString()} kWh</div><div class="lbl">Used to offset bill (${solarUsagePct}%)</div></div>
      <div class="result-tile"><div class="val">RM ${Math.round(monthlySavings).toLocaleString()}</div><div class="lbl">Estimate monthly savings</div></div>
      <div class="result-tile"><div class="val">RM ${Math.round(annualSavings).toLocaleString()}</div><div class="lbl">Estimate annual savings</div></div>
      <div class="result-tile"><div class="val" style="${excessKwh<0?'color:var(--amber);':''}">${Math.round(excessKwh).toLocaleString()} kWh</div><div class="lbl">Excess to TNB vs. MAQ</div></div>
    </div>
    <p style="font-size:11px; color:var(--ink-soft); margin-top:10px;">Savings estimate = monthly generation × solar usage % × effective tariff rate. Actual savings depend on the client's real load profile, export arrangement (e.g. NEM), and the exact TNB tariff components — use this for early conversations, and confirm against a full analysis before quoting.</p>
  `;
}

function calcSavings(){

  const bill = parseFloat(document.getElementById('svBill').value) || 0;
  const offset = (parseFloat(document.getElementById('svOffset').value) || 0)/100;
  const esc = (parseFloat(document.getElementById('svEsc').value) || 0)/100;
  const monthlySaving = bill * offset;
  const yearlySaving = monthlySaving * 12;
  const paybackYears = yearlySaving > 0 ? cost / yearlySaving : Infinity;
  let cumulative = 0, year25 = 0;
  for(let y=1; y<=25; y++){ cumulative += yearlySaving * Math.pow(1+esc, y-1); if(y===25) year25 = cumulative; }
  const netSaving25 = year25 - cost;
  document.getElementById('svResults').innerHTML = `
    <div class="result-strip">
      <div class="result-tile"><div class="val">RM ${monthlySaving.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="lbl">Estimated monthly saving</div></div>
      <div class="result-tile"><div class="val">${isFinite(paybackYears) ? paybackYears.toFixed(1)+' yrs' : '—'}</div><div class="lbl">Simple payback period</div></div>
      <div class="result-tile"><div class="val">RM ${Math.round(netSaving25).toLocaleString()}</div><div class="lbl">Net saving over 25 years</div></div>
    </div>`;
}

/* ---------------------------------------------------------
   PAGE — MODULE 06: GITA CALCULATOR
   Green Investment Tax Allowance estimate — Capital Allowance (CA)
   schedule + GITA offset, worked out from the system cost, income
   tax rate and incentive category (No Battery 60% / With Battery 100%).
--------------------------------------------------------- */
// Standard Malaysia Capital Allowance schedule for plant & machinery:
// Initial Allowance 20% + Annual Allowance 14% in year 1 (34% combined),
// then 14% per year until the full 100% of cost has been claimed (the
// final year takes only the remainder needed to reach exactly 100%).
function gitaCaScheduleRates(){
  const rates = [];
  let cumulative = 0;
  let year = 1;
  while(cumulative < 100 - 1e-9){
    let rate = year === 1 ? 34 : 14;
    if(cumulative + rate > 100) rate = 100 - cumulative;
    rates.push(rate);
    cumulative += rate;
    year++;
  }
  return rates;
}
function renderGitaCalc(){
  return `

      <div>

}
function calcGitaCalculator(){
  const systemCost = parseFloat(document.getElementById('gcSystemCost').value) || 0;
  const taxRate = (parseFloat(document.getElementById('gcTaxRate').value) || 0) / 100;
  const gitaWeight = (parseFloat(document.getElementById('gcCategory').value) || 0) / 100;
  const annualSavings = parseFloat(document.getElementById('gcAnnualSavings').value) || 0;
  const categoryLabel = document.getElementById('gcCategory').selectedOptions[0].text;

  const rates = gitaCaScheduleRates();
  let caRows = '', accumulatedCA = 0;
  rates.forEach((rate, i)=>{
    const amortized = systemCost * (rate/100);
    const taxSaved = amortized * taxRate;
    accumulatedCA += taxSaved;
    caRows += `<tr><td>Year ${String(i+1).padStart(2,'0')}</td><td>${rate}%</td><td>${Math.round(amortized).toLocaleString()}</td><td>RM ${taxSaved.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td></tr>`;
  });

  const gitaSaving = systemCost * gitaWeight * taxRate;
  const totalSavings = accumulatedCA + gitaSaving;
  const netCost = systemCost - totalSavings;
  const roiYears = annualSavings > 0 ? (netCost / annualSavings) : null;
  const offsetPct = systemCost > 0 ? (totalSavings / systemCost * 100) : 0;

  document.getElementById('gcResults').innerHTML = `
    <h4 style="margin:20px 0 8px; font-size:14px; color:var(--navy);">Result</h4>
    <div class="result-strip">
      <div class="result-tile"><div class="val">RM ${Math.round(systemCost).toLocaleString()}</div><div class="lbl">System capital cost</div></div>
      <div class="result-tile"><div class="val">RM ${Math.round(totalSavings).toLocaleString()}</div><div class="lbl">Total savings (tax offset)</div></div>
      <div class="result-tile"><div class="val">RM ${Math.round(netCost).toLocaleString()}</div><div class="lbl">Actual net cost</div></div>
      <div class="result-tile"><div class="val">${roiYears!==null ? roiYears.toFixed(1)+' yrs' : '—'}</div><div class="lbl">Est. ROI period</div></div>
      <div class="result-tile"><div class="val">-${offsetPct.toFixed(0)}%</div><div class="lbl">Total investment offset</div></div>
    </div>

    <h4 style="margin:20px 0 8px; font-size:13.5px; color:var(--navy);">① Capital Allowance (CA) Schedule</h4>
    <table>
      <thead><tr><th>Deduction Cycle</th><th>Rate</th><th>Amortized (RM)</th><th>Tax Saved (RM)</th></tr></thead>
      <tbody>${caRows}</tbody>
      <tfoot><tr><td colspan="3" style="font-weight:600;">Accumulated CA Tax Benefits</td><td style="font-weight:600; color:var(--navy);">RM ${accumulatedCA.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td></tr></tfoot>
    </table>

    <h4 style="margin:20px 0 8px; font-size:13.5px; color:var(--navy);">② Green Investment Tax Allowance (GITA)</h4>
    <div class="result-strip">
      <div class="result-tile"><div class="val">${categoryLabel}</div><div class="lbl">Category weight</div></div>
      <div class="result-tile"><div class="val">RM ${gitaSaving.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="lbl">Calculated GITA tax saving</div></div>
    </div>
    <p style="font-size:11px; color:var(--ink-soft); margin-top:10px;">Estimate only — Capital Allowance follows the standard Initial Allowance (20%) + Annual Allowance (14%/yr) schedule for plant &amp; machinery; GITA offset applies the selected category weight to the system cost. Confirm exact eligibility and rates with MIDA / LHDN before relying on this for a tax filing.</p>
  `;
}

function calcKPI(){
  const closedWon = state.leads.filter(l=>l.stage==='Closed Won');
  const actualSales = closedWon.reduce((sum,l)=>sum+(l.projectAmount||0),0);
  const totalSystemInstall = closedWon.reduce((sum,l)=>sum+(l.kw||0),0);
  const target = state.kpi.yearlyTargetSales||0;
  const pctOfTarget = target>0 ? (actualSales/target)*100 : 0;

  const qualifiedLeads = state.leads.filter(l=>l.qualified);
  const qualifiedPipelineSize = qualifiedLeads.reduce((sum,l)=>sum+(l.projectAmount||0),0);
  const qualifiedPipelineTarget = target * (state.kpi.qualifiedPipelineMultiplier||3);

  const pastProposal = state.leads.filter(l=>['Proposal Sent','Negotiation','Closed Won'].includes(l.stage));
  const winRate = pastProposal.length ? (closedWon.length/pastProposal.length)*100 : 0;

  const pastSiteVisit = state.leads.filter(l=>['Site Survey','Proposal Sent','Negotiation','Closed Won'].includes(l.stage));
  const siteVisitToProposalRate = pastSiteVisit.length ? (pastProposal.length/pastSiteVisit.length)*100 : 0;

  return { actualSales, totalSystemInstall, target, pctOfTarget, qualifiedPipelineSize, qualifiedPipelineTarget, winRate, siteVisitToProposalRate, closedWonCount: closedWon.length };
}

function kpiBarClass(pct, min, max){
  if(max!==undefined){ return (pct>=min && pct<=max) ? 'good' : (pct<min ? 'bad' : ''); }
  return pct>=min ? 'good' : (pct < min*0.6 ? 'bad' : '');
}

/* Simple inline SVG bar chart comparing Actual Sales vs Target Sales —
   no external chart library needed, works fully offline. */
function salesComparisonChartSVG(actual, target){
  const w = 520, h = 220, padTop = 20, padBottom = 34, padLeft = 90, padRight = 30;
  const chartH = h - padTop - padBottom;
  const maxVal = Math.max(actual, target, 1) * 1.15;
  const barW = 90;
  const gap = 70;
  const groupStartX = padLeft + 30;
  const rm = n => 'RM ' + Math.round(n||0).toLocaleString();

  const bars = [
    { label:'Target', value: target, color:'var(--ink-soft)' },
    { label:'Actual',  value: actual, color: actual>=target ? 'var(--green)' : 'var(--amber)' },
  ];

  const barsSVG = bars.map((b,i)=>{
    const barH = maxVal>0 ? (b.value/maxVal)*chartH : 0;
    const x = groupStartX + i*(barW+gap);
    const y = padTop + (chartH - barH);
    return `
      <text x="${x+barW/2}" y="${y-10}" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--ink)">${rm(b.value)}</text>
      <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="6" style="fill:${b.color}"></rect>
      <text x="${x+barW/2}" y="${h-padBottom+22}" text-anchor="middle" font-size="12.5" style="fill:var(--ink-soft)">${b.label}</text>
    `;
  }).join('');

  // baseline + a couple of horizontal gridlines
  const gridLines = [0.5, 1].map(f=>{
    const y = padTop + chartH - (chartH*f);
    const val = maxVal*f;
    return `<line x1="${padLeft}" y1="${y}" x2="${w-padRight}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/>
      <text x="${padLeft-10}" y="${y+4}" text-anchor="end" font-size="10.5" style="fill:var(--ink-soft)">${rm(val)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}
    <line x1="${padLeft}" y1="${padTop+chartH}" x2="${w-padRight}" y2="${padTop+chartH}" style="stroke:var(--ink-soft)" stroke-width="1.5"/>
    ${barsSVG}
  </svg>`;
}

/* ---------------------------------------------------------
   PAGE — MODULE 11: WEEKLY JOB REPORT
   Every C&I staff member logs what they worked on each week —
   one place the HOD can pull up to show top management what the
   department has been doing. Stored in the shared portal state
   (same storage as everything else), grouped by ISO week.
--------------------------------------------------------- */
const WEEKLY_STATUS_OPTIONS = ['Not Started','In Progress','Completed','Issue'];
function weeklyStatusColors(status){
  switch(status){
    case 'Completed': return { bg:'#DCF3E4', fg:'#1E7A4C' };
    case 'In Progress': return { bg:'#FCEBC7', fg:'#8A5A00' };
    case 'Issue': return { bg:'#F7D9D9', fg:'#B23434' };
    default: return { bg:'#E4EAE2', fg:'#5E7069' }; // Not Started
  }
}
function wrGetISOWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return { year: d.getUTCFullYear(), week: weekNo };
}
function wrGetWeekMonday(year, week){
  const simple = new Date(Date.UTC(year, 0, 1 + (week - 1) * 7));
  const dow = simple.getUTCDay();
  const monday = new Date(simple);
  if (dow <= 4) monday.setUTCDate(simple.getUTCDate() - dow + 1);
  else monday.setUTCDate(simple.getUTCDate() + 8 - dow);
  return monday;
}
const WR_MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function wrFmtShort(d){ return d.getUTCDate() + ' ' + WR_MONTH_NAMES[d.getUTCMonth()]; }
function wrTodayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function wrFmtDateDisplay(iso){
  if (!iso) return '—';
  const parts = iso.split('-');
  if (parts.length !== 3) return iso;
  const y = parseInt(parts[0],10), m = parseInt(parts[1],10)-1, day = parseInt(parts[2],10);
  return String(day).padStart(2,'0') + ' ' + WR_MONTH_NAMES[m] + ' ' + y;
}
function wrWeekKey(s){ return s.year + '-W' + String(s.week).padStart(2,'0'); }
// Which week is currently being viewed in Module 11 — module-local, not part of the saved state.
let wrView = wrGetISOWeek(new Date());
let wrLastName = '';

function renderWeeklyReports(){
  const monday = wrGetWeekMonday(wrView.year, wrView.week);
  const sunday = new Date(monday); sunday.setUTCDate(monday.getUTCDate() + 6);
  const rangeText = wrFmtShort(monday) + ' – ' + wrFmtShort(sunday) + ' ' + sunday.getUTCFullYear();
  const isCurrentWeek = wrWeekKey(wrView) === wrWeekKey(wrGetISOWeek(new Date()));
  const entries = state.weeklyReports
    .filter(e => e.year===wrView.year && e.week===wrView.week)
    .sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id-b.id);

  const weeksSeen = {};
  state.weeklyReports.forEach(e=>{ weeksSeen[e.year+'-W'+String(e.week).padStart(2,'0')] = { year:e.year, week:e.week }; });
  const weekOptions = Object.values(weeksSeen).sort((a,b)=> (b.year-a.year) || (b.week-a.week));

  const total = entries.length;
  const completed = entries.filter(e=>e.status==='Completed').length;
  const inProgress = entries.filter(e=>e.status==='In Progress').length;
  const issues = entries.filter(e=>e.status==='Issue').length;

  return `
    <div class="page-head">
      <div>
        <p class="eyebrow">Module 11</p><h2>Weekly Job Report</h2>
        <p>Everyone in C&amp;I logs what they worked on each week here — one place to show top management what the department has been doing.</p>
      </div>
      <button class="btn btn-ghost" type="button" data-pdf-export-btn>⬇ Export as PDF</button>
    </div>
    <div class="panel">
      <div class="toolbar-row">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="btn btn-ghost" type="button" id="wrPrevWeek" title="Previous week">‹</button>
          <div style="text-align:center; min-width:170px;">
            <div style="font-weight:600; color:var(--navy); font-size:14px;">
              Week ${wrView.week}, ${wrView.year}
              ${!isCurrentWeek ? `<span style="font-size:10px; font-weight:700; color:#B23434; background:#F7D9D9; padding:1px 6px; border-radius:4px; margin-left:6px; vertical-align:middle;">ARCHIVED</span>` : ''}
            </div>
            <div style="font-size:11.5px; color:var(--ink-soft); margin-top:1px;">${rangeText}</div>
          </div>
          <button class="btn btn-ghost" type="button" id="wrNextWeek" title="Next week">›</button>
        </div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <select id="wrWeekSelect">
            <option value="">Previous Reports…</option>
            ${weekOptions.map(w=>`<option value="${w.year}-${w.week}" ${w.year===wrView.year && w.week===wrView.week ? 'selected':''}>Week ${w.week}, ${w.year}</option>`).join('')}
          </select>
          <button class="btn btn-ghost" type="button" id="wrThisWeek">This week</button>
        </div>
      </div>
    </div>

    <div class="kpi-grid" style="margin-top:16px;">
      <div class="kpi-tile"><p class="kpi-label">Entries This Week</p><div class="kpi-value">${total}</div></div>
      <div class="kpi-tile"><p class="kpi-label">Completed</p><div class="kpi-value" style="color:#1E7A4C;">${completed}</div></div>
      <div class="kpi-tile"><p class="kpi-label">In Progress</p><div class="kpi-value" style="color:#8A5A00;">${inProgress}</div></div>
      <div class="kpi-tile"><p class="kpi-label">Issues</p><div class="kpi-value" style="color:${issues>0?'#B23434':'#1E7A4C'};">${issues}</div></div>
    </div>

    <div class="panel" style="margin-top:16px; padding:0; overflow-x:auto;">
      <table style="margin:0;">
        <thead><tr><th style="width:120px;">Name</th><th style="width:100px;">Date</th><th>Job Scope</th><th style="width:120px;">Status</th><th>Notes / Issues</th><th style="width:40px;"></th></tr></thead>
        <tbody>
          ${entries.length ? entries.map(e=>{
            const col = weeklyStatusColors(e.status);
            return `<tr>
              <td style="font-weight:600; color:var(--navy);">${escapeHtml(e.pic||'—')}</td>
              <td style="white-space:nowrap; color:var(--ink-soft);">${escapeHtml(wrFmtDateDisplay(e.date))}</td>
              <td style="white-space:pre-wrap;">${escapeHtml(e.scope||'')}</td>
              <td><span style="display:inline-block; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; background:${col.bg}; color:${col.fg};">${escapeHtml(e.status||'Not Started')}</span></td>
              <td style="white-space:pre-wrap; color:var(--ink-soft);">${escapeHtml(e.notes||'—')}</td>
              <td style="text-align:center;"><button type="button" data-del-weekly="${e.id}" title="Delete" style="background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:16px; border-radius:6px; width:26px; height:26px;">✕</button></td>
            </tr>`;
          }).join('') : `<tr><td colspan="6" style="text-align:center; color:var(--ink-soft); padding:28px;">No entries yet for this week. Add one below.</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="panel" style="margin-top:16px;">
      <h3 style="margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);">Add New Entry</h3>
      <div class="row">
        <div class="field"><label>Name</label><input type="text" id="wrInPic" placeholder="e.g. Aiman" value="${escapeAttr(wrLastName)}"></div>
        <div class="field"><label>Date</label><input type="date" id="wrInDate" value="${wrTodayISO()}"></div>
        <div class="field"><label>Status</label>
          <select id="wrInStatus">
            ${WEEKLY_STATUS_OPTIONS.map(s=>`<option value="${s}" ${s==='In Progress'?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field" style="grid-column:1 / -1;"><label>Job scope for this week</label><textarea id="wrInScope" rows="2" placeholder="What did you work on…"></textarea></div>
      </div>
      <div class="row">
        <div class="field" style="grid-column:1 / -1;"><label>Notes / issues (if any)</label><textarea id="wrInNotes" rows="2" placeholder="Optional"></textarea></div>
      </div>
      <button class="btn btn-primary" id="wrAddBtn">+ Add Entry</button>
      <p id="wrStatusLine" style="font-size:12px; color:var(--ink-soft); margin-top:8px; min-height:16px;">&nbsp;</p>
    </div>
  `;
}

function wrAddEntry(){
  const picEl = document.getElementById('wrInPic');
  const scopeEl = document.getElementById('wrInScope');
  const statusLine = document.getElementById('wrStatusLine');
  const pic = picEl.value.trim();

    week: wrView.week,

  });

}
function buildWeeklyReportDocHtml(){
  const monday = wrGetWeekMonday(wrView.year, wrView.week);
  const sunday = new Date(monday); sunday.setUTCDate(monday.getUTCDate() + 6);
  const rangeText = wrFmtShort(monday) + ' – ' + wrFmtShort(sunday) + ' ' + sunday.getUTCFullYear();
  const entries = state.weeklyReports
    .filter(e => e.year===wrView.year && e.week===wrView.week)
    .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const rows = entries.length ? entries.map(e=>{
    const col = weeklyStatusColors(e.status);

      <td>${escapeHtml(e.pic||'—')}</td>
      <td style="white-space:nowrap;">${escapeHtml(wrFmtDateDisplay(e.date))}</td>

      <td><span style="display:inline-block; font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; background:${col.bg}; color:${col.fg};">${escapeHtml(e.status||'Not Started')}</span></td>
      <td>${escapeHtml(e.notes||'—')}</td>

    <div class="report-doc-grid">
      <div class="report-doc-field"><label>Week</label><div>Week ${wrView.week}, ${wrView.year}</div></div>
      <div class="report-doc-field"><label>Date range</label><div>${rangeText}</div></div>
      <div class="report-doc-field"><label>Entries</label><div>${entries.length}</div></div>
    </div>
    <table>
      <thead><tr><th style="width:110px;">Name</th><th style="width:90px;">Date</th><th>Job Scope</th><th style="width:100px;">Status</th><th>Notes / Issues</th></tr></thead>
      <tbody>${rows}</tbody>

}


/* ---------------------------------------------------------
   EVENT HANDLERS
--------------------------------------------------------- */
function attachPageHandlers(){
  if(currentPage === 'itadmin') attachITAdminHandlers();
  const gotoBtn = document.getElementById('gotoSettingsBtn');
  gotoBtn && gotoBtn.addEventListener('click', ()=>{ currentPage='stageSettings'; render(); });
  document.querySelectorAll('button[data-page="projects"]').forEach(b=> b.addEventListener('click', ()=>{ currentPage='projects'; render(); }));

  if(currentPage === 'projects'){
    const form = document.getElementById('addClientForm');
    form && form.addEventListener('submit', e=>{
      e.preventDefault();
      const name = document.getElementById('newClientName').value.trim();
      const address = document.getElementById('newClientAddress').value.trim();
      const agent = document.getElementById('newClientAgent').value.trim();
      const systemSize = parseFloat(document.getElementById('newClientSize').value) || 0;
      const quotedPrice = parseFloat(document.getElementById('newClientPrice').value) || 0;
      if(!name) return;
      state.clients.push({
        id: uid(), name, address, agent, systemSize, quotedPrice,
        stages: buildStages(state.stageDefs), stageRemarks: buildRemarks(state.stageDefs),
        materials: [], roofPhotos: []
      });
      commit();
    });
    const searchInput = document.getElementById('clientSearchInput');
    const searchBtn = document.getElementById('clientSearchBtn');
    const searchClearBtn = document.getElementById('clientSearchClearBtn');
    searchBtn && searchBtn.addEventListener('click', ()=>{
      searchQuery = searchInput.value.trim();
      render();
    });
    searchInput && searchInput.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); searchQuery = searchInput.value.trim(); render(); }
    });
    searchClearBtn && searchClearBtn.addEventListener('click', ()=>{
      searchQuery = '';
      render();
    });
    document.querySelectorAll('input[data-upload-roof]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const clientId = parseInt(inp.dataset.uploadRoof);
        const client = state.clients.find(c=>c.id===clientId);
        if(!client) return;
        const files = Array.from(inp.files || []);
        if(!files.length) return;
        if(!client.roofPhotos) client.roofPhotos = [];
        for(const file of files){
          try{
            const dataUrl = await readAndCompressImage(file);
            client.roofPhotos.push({ id: uid(), name: file.name, dataUrl });
          }catch(err){ console.error('Photo upload failed', err); }
        }
        commit();
      });
    });
    document.querySelectorAll('[data-remove-photo]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const [clientIdStr, photoIdStr] = btn.dataset.removePhoto.split(':');
        const client = state.clients.find(c=>c.id===parseInt(clientIdStr));
        if(!client) return;
        client.roofPhotos = (client.roofPhotos||[]).filter(p=>p.id!==parseInt(photoIdStr));
        commit();
      });
    });
    document.querySelectorAll('[data-toggle-check]').forEach(row=>{
      row.addEventListener('click', e=>{
        if(e.target.closest('[data-toggle-remark]')) return;
        const clientId = parseInt(row.dataset.client);
        const stageKey = row.dataset.stage;
        const client = state.clients.find(c=>c.id===clientId);
        client.stages[stageKey] = !client.stages[stageKey];
        commit();
      });
    });
    document.querySelectorAll('[data-toggle-remark]').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const key = btn.dataset.toggleRemark;
        if(openRemarks.has(key)) openRemarks.delete(key); else openRemarks.add(key);
        render();
      });
    });
    document.querySelectorAll('textarea[data-remark-client]').forEach(ta=>{
      ta.addEventListener('change', ()=>{
        const client = state.clients.find(c=>c.id===parseInt(ta.dataset.remarkClient));
        client.stageRemarks[ta.dataset.remarkStage] = ta.value;
        commit();
      });
    });
    document.querySelectorAll('[data-remove-client]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = parseInt(btn.dataset.removeClient);
        if(confirm('Remove this client and all their data?')){
          state.clients = state.clients.filter(c=>c.id!==id);
          commit();
        }
      });
    });
  }

  if(currentPage === 'stageSettings'){
    document.querySelectorAll('[data-rename]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const def = state.stageDefs.find(d=>d.key===inp.dataset.rename);
        def.label = inp.value.trim() || def.label;
        commit();
      });
    });
    document.querySelectorAll('[data-move]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.dataset.idx);
        const dir = btn.dataset.move;
        const swapWith = dir==='up' ? idx-1 : idx+1;
        if(swapWith<0 || swapWith>=state.stageDefs.length) return;
        const arr = state.stageDefs;
        [arr[idx], arr[swapWith]] = [arr[swapWith], arr[idx]];
        commit();
      });
    });
    document.querySelectorAll('[data-delete-stage]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(state.stageDefs.length<=1) return;
        const key = btn.dataset.deleteStage;
        if(!confirm('Remove this stage? Its tick status and remarks will be removed from every client.')) return;
        state.stageDefs = state.stageDefs.filter(d=>d.key!==key);
        state.clients.forEach(c=>{ delete c.stages[key]; delete c.stageRemarks[key]; });
        commit();
      });
    });
    const addForm = document.getElementById('addStageForm');
    addForm && addForm.addEventListener('submit', e=>{
      e.preventDefault();
      const label = document.getElementById('newStageLabel').value.trim();
      if(!label) return;
      const key = 'stage_' + uid();
      state.stageDefs.push({ key, label });
      state.clients.forEach(c=>{ c.stages[key]=false; c.stageRemarks[key]=''; });
      commit();
    });
  }

  if(currentPage === 'materials'){
    document.querySelectorAll('[data-select-client]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        currentMaterialsClientId = parseInt(chip.dataset.selectClient);
        render();
      });
    });
    const matSearchInput = document.getElementById('matSearchInput');
    const matSearchBtn = document.getElementById('matSearchBtn');
    const matSearchClearBtn = document.getElementById('matSearchClearBtn');
    matSearchBtn && matSearchBtn.addEventListener('click', ()=>{
      matSearchQuery = matSearchInput.value.trim();
      render();
    });
    matSearchInput && matSearchInput.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); matSearchQuery = matSearchInput.value.trim(); render(); }
    });
    matSearchClearBtn && matSearchClearBtn.addEventListener('click', ()=>{
      matSearchQuery = '';
      render();
    });
    const addForm = document.getElementById('addMatForm');
    addForm && addForm.addEventListener('submit', e=>{
      e.preventDefault();
      const client = state.clients.find(c=>c.id===currentMaterialsClientId);
      const name = document.getElementById('matName').value.trim();
      const supplier = document.getElementById('matSupplier').value.trim();
      const qty = parseFloat(document.getElementById('matQty').value)||0;
      const unit = document.getElementById('matUnit').value.trim();
